  async function commitImport(review) {
    const made = new Map();
    const rooms = new Map(archive.conversations.map(room => [room.id,room]));
    const positions = new Map();
    if (active && !active.id.startsWith('example-')) positions.set(active.id,firstVisible());
    const created = [];
    const visited = [];
    const updated = new Set();
    const assignments = {...organizer.assignments};
    let favorites = organizer.favorites;
    let inserted = 0, duplicates = 0;
    for (const item of review) {
      const bindings = Object.fromEntries(item.speakers.map(({name,choose}) => {
        if (choose.value === 'keep') return [name,null];
        if (choose.value !== 'new-role' && choose.value !== 'new-me') return [name,choose.value];
        const me = choose.value === 'new-me';
        const key = String(me) + ':' + testName(name);
        if (!made.has(key)) made.set(key,{id:uid(),name,me,aliases:[]});
        return [name,made.get(key).id];
      }));
      const incoming = {...item.data,bindings};
      const target = rooms.get(item.target.value);
      if (target) {
        const placements = item.placementFields().map(({block, mode, day}) => ({...block, mode: mode.value, day: day.value}));
        const result = ArchiveLibraryModel.mergeConversation(target,incoming,placements);
        const anchor = positions.get(target.id) ?? lastPosition(target.id);
        positions.set(target.id,result.oldToNew[anchor] ?? 0);
        favorites = ArchiveLibraryModel.remapFavorites(favorites,target.id,result.oldToNew);
        rooms.set(target.id,result.conversation);
        visited.push(target.id);
        updated.add(target.id);
        inserted += result.inserted;
        duplicates += result.duplicates;
      } else {
        const room = {...incoming,id:uid(),title:item.title.value.trim() || item.data.title,
          importTitle:item.data.title,type:item.type.value,scene:item.scene.value.trim()};
        if (item.folder.value) assignments[room.id] = item.folder.value;
        rooms.set(room.id,room);
        created.push(room.id);
        visited.push(room.id);
        inserted += room.count;
      }
    }
    const order = [...created,...archive.conversations.map(room => room.id)];
    const nextArchive = {...archive,profiles:[...archive.profiles,...made.values()],
      conversations:order.map(id => rooms.get(id))};
    const nextOrganizer = {...organizer,favorites,assignments};
    const saved = await writeTogether([['archive',nextArchive],['organizer',nextOrganizer]],
      {type:'import', label:'导入 ' + review.length + ' 份聊天记录'});
    if (!saved) { status('导入保存失败，请重试。'); return false; }
    archive = nextArchive;
    organizer = nextOrganizer;
    clearTimeout(positionTimer);
    for (const [id,index] of positions) {
      if (saved) remember(id,index);
      else withinSession.set(id,index);
    }
    importContext = null;
    closeModal();
    active = null;
    demo = [];
    $('search').value = '';
    openConversation(rooms.get(visited[0]));
    const summary = [
      created.length && '新建 ' + created.length + ' 个',
      updated.size && '更新 ' + updated.size + ' 个',
      '新增 ' + inserted + ' 条',
      duplicates && '排重 ' + duplicates + ' 条'
    ].filter(Boolean).join(' · ');
    status(saved ? summary : summary + ' · 暂存在此窗口');
  }

  function ruleEditor(onChange) {
    const panel = node('details', 'rule-panel');
    const list = node('div', 'form-stack rule-list');
    const entries = [];
    function read(strict = false) {
      const rules = entries.map(entry => ArchivePresets.cleanRule(entry.value()));
      if (strict && rules.some(rule => !rule)) throw new Error('每条样式规则都要填起始和结束标记。');
      return rules.filter(Boolean);
    }
    const add = button('添加样式规则', () => append(ArchivePresets.defaultRule), 'button outline');
    function append(rule) {
      if (entries.length >= 24) return;
      const card = node('div', 'form-stack rule-card');
      const inputs = {};
      function build(key, label, type = 'text', hint = '') {
        const input = node('input');
        input.type = type;
        input.placeholder = hint;
        if (type === 'checkbox') input.checked = Boolean(rule[key]);
        else input.value = rule[key] || (key === 'color' ? '#385d97' : '');
        if (type === 'text') input.maxLength = key === 'font' ? 65 : 40;
        if (type === 'number') { input.min = 10; input.max = 42; }
        input.addEventListener('input', onChange);
        inputs[key] = input;
        const labelNode = field(label, input);
        if (type === 'checkbox') labelNode.classList.add('check-field');
        return labelNode;
      }
      const markers = node('div', 'form-grid');
      markers.append(build('open','起始标记'), build('close','结束标记'));
      const typography = node('div', 'form-grid');
      typography.append(build('font','字体名称（选填）','text','如 宋体、楷体、serif'),
        build('size','字号（选填）','number','留空跟随正文'));
      const palette = node('div', 'rule-color');
      palette.append(build('color','文字颜色','color'));
      const customColor = node('input');
      customColor.type = 'checkbox';
      customColor.checked = Boolean(rule.color);
      const enabling = field('自订颜色', customColor);
      enabling.classList.add('check-field');
      inputs.color.disabled = !customColor.checked;
      customColor.addEventListener('change', () => { inputs.color.disabled = !customColor.checked; onChange(); });
      palette.prepend(enabling);
      const flags = node('div', 'rule-options');
      flags.append(build('bold','粗体','checkbox'), build('italic','斜体','checkbox'));
      const markerMode = node('select');
      markerMode.append(option('hide','隐藏标记'),option('keep','显示原标记'),option('replace','替换显示标记'));
      markerMode.value = rule.markerMode || (rule.keep ? 'keep' : 'hide');
      const replacements = node('div','form-grid');
      replacements.append(build('displayOpen','显示为 · 起始'),build('displayClose','显示为 · 结束'));
      const updateMarkers = () => { replacements.hidden = markerMode.value !== 'replace'; onChange(); };
      markerMode.addEventListener('change',updateMarkers);
      replacements.hidden = markerMode.value !== 'replace';
      const entry = {value: () => ({
        open:inputs.open.value, close:inputs.close.value, color:customColor.checked ? inputs.color.value : '',
        font:inputs.font.value, size:Number(inputs.size.value) || 0, bold:inputs.bold.checked,
        italic:inputs.italic.checked, keep:markerMode.value === 'keep',markerMode:markerMode.value,
        displayOpen:inputs.displayOpen.value,displayClose:inputs.displayClose.value
      })};
      flags.append(button('移除规则', () => {
        entries.splice(entries.indexOf(entry), 1);
        card.remove();
        add.disabled = false;
        onChange();
      }));
      card.append(markers,field('标记如何显示',markerMode),replacements,typography,palette,flags);
      entries.push(entry);
      list.append(card);
      add.disabled = entries.length >= 24;
      onChange();
    }
    function set(rules) {
      entries.length = 0;
      list.replaceChildren();
      add.disabled = false;
      for (const rule of rules || []) append(rule);
    }
    panel.append(node('summary', '', '文本标记样式'), list, add,
      node('p', 'help', '识别标记与显示标记分别设置。例如识别 [ 和 ]，以 * 和 * 显示，原文保持原样。规则靠前的优先。'));
    return {panel, read, set};
  }

      imageFile.value = '';
      if (!selected || decodingImage) return;
      decodingImage = uploadImage.disabled = true;
      try {
        const picture = await decodePicture(selected, 1600, .82);

      } catch { status('无法读取这张图片，请换一张再试。'); }
      finally { decodingImage = uploadImage.disabled = false; }
    });
    const ranges = node('div', 'form-grid');
    ranges.append(range('size','字号',13,24,1,' px'), range('line','行距',1.3,2.2,.01,''), range('width','气泡宽度',50,96,1,'%'), range('gap','气泡间距',0,48,1,' px'));
    const avatars = node('input');
    avatars.type = 'checkbox';
    fields.set('avatars', avatars);
    const showAvatars = field('显示头像', avatars);
    showAvatars.classList.add('check-field');
    const custom = node('input');
    custom.placeholder = '改过设置后可存为新预设';
    custom.maxLength = 60;
    const customName = field('新预设名称（选填）', custom);
    const returnStyle = () => styles().find(style => style.id === (preset.value === 'default' ? defaultStyleFor(conversation) : preset.value)) || baseStyles[0];
    const rules = ruleEditor(updatePreview);
    const currentPalette = () => theme.value === 'night' ? nightColors : dayColors;
    function syncPalette() {

    const getValues = (strict = false) => ({...Object.fromEntries([...fields].map(([key, input]) => [key,

  function downloadText(filename, text, mime = 'text/plain') {

      } catch {
        status('无法打开系统保存窗口。');
        return;
      }
    }
    const url = URL.createObjectURL(new Blob([text], {type: mime + ';charset=utf-8'}));
    const link = node('a');
    link.href = url;
    link.download = filename.replace(/[\\/:*?"<>|]/g, '_');

  async function saveBinary(filename, blob) {
    const bridge = globalThis.NativeArchive;
    if (typeof bridge?.beginBinaryExport === 'function') {
      const token = bridge.beginBinaryExport(filename, blob.type);
      if (!token) throw new Error('前一项导出还在保存，请完成后再试。');
      try {
        for (let offset = 0; offset < blob.size; offset += 192 * 1024) {
          const part = blob.slice(offset, offset + 192 * 1024);
          const encoded = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(',') + 1));
            reader.onerror = () => reject(new Error('无法准备导出文件。'));
            reader.readAsDataURL(part);
          });
          if (!bridge.appendBinaryExport(token, encoded)) throw new Error('写入导出文件失败，请重试。');
          await afterPaint();
        }
        if (!bridge.finishBinaryExport(token)) throw new Error('无法打开系统保存窗口。');
      } catch (error) {
        bridge.abortBinaryExport(token);
        throw error;
      }
      return;

      if (input.value.startsWith('name:')) return {sender: input.value.slice(5)};

        firstPage = at;

    async function create() {
      if (pending || imageExportBusy || !layoutPlan || approved !== JSON.stringify(options())) return;
      const outputPlan = layoutPlan;
      const cachedBlob = firstBlob, cachedPage = firstPage;
      const forceZip = bundle.checked;
      const settings = [height, avatarMask.control, nameMask.control, bodyNames, bundle];
      for (const input of settings) input.disabled = true;
      pending = imageExportBusy = true;
      generate.disabled = refresh.disabled = true;
      const progress = $('importProgress');
      progress.hidden = false;
      const tell = message => { progress.textContent = message; notice(message); };
      try {
        const files = [];
        for (let index = 0; index < outputPlan.pages.length; index++) {
          const blob = index === cachedPage && cachedBlob ? cachedBlob : await ArchiveExport.renderPage(outputPlan, index, tell);
          files.push({name:'chat-' + String(index + 1).padStart(4,'0') + '.png', blob});
        }
        tell('正在准备保存…');
        const zip = files.length > 1 || forceZip;
        const blob = zip ? await ArchiveExport.zip(files) : files[0].blob;
        await saveBinary('聊天片段.' + (zip ? 'zip' : 'png'), blob);
        notice('已生成 ' + files.length + ' 张，请在保存窗口选择位置。');
      } catch (error) { notice(error.message || '导出失败，请重试。'); }
      finally {
        progress.hidden = true;
        pending = imageExportBusy = false;
        for (const input of settings) input.disabled = false;
        refresh.disabled = false;
        generate.disabled = approved !== JSON.stringify(options());
      }

    const nextArchive = {...archive, conversations:archive.conversations.map(room => room.id === id ? result.conversation : room)};

    let next = result.oldToNew[at];

  function confirmUndo(index) {
    const wanted = undoHistory.slice(index);
    if (!wanted.length) return;
    const ticket = undoHistory.at(-1).id;
    const {body, actions} = dialog('确认撤回');
    body.classList.add('form-stack');
    body.append(node('p','help',wanted.length === 1 ? '将撤回「' + wanted[0].label + '」。' :
      '将撤回上次导入及其后的 ' + (wanted.length - 1) + ' 次操作。'));
    let state = {archive, organizer, preferences};
    let changed = 0;
    for (const action of [...wanted].reverse()) {
      changed += ArchiveHistory.conflicts(state, action);
      state = ArchiveHistory.restore(state, action);
    }
    if (changed) body.append(node('p','help','相关项目在操作后又有修改。撤回会将这些项目恢复到操作前，请核对下面的操作。'));
    for (const action of [...wanted].reverse()) body.append(node('p','help','↶ ' + action.label));
    const apply = button('确认撤回', async () => {

      apply.disabled = true;
      apply.textContent = '正在撤回…';
      await afterPaint();
      let restored = {archive, organizer, preferences};
      const positions = new Map();
      for (const action of [...wanted].reverse()) {
        restored = ArchiveHistory.restore(restored, action);
        for (const [id, position] of Object.entries(action.positions || {})) positions.set(id, position);
      }
      if (!await writeTogether([['archive',restored.archive],['organizer',restored.organizer],
        ['preferences',restored.preferences],['history',undoHistory.slice(0,index)]])) {
        status('保存失败，请重试。'); apply.disabled = false; apply.textContent = '确认撤回'; return;
      }
      if (active && !positions.has(active.id)) remember(active.id,firstVisible());
      archive = restored.archive;
      organizer = restored.organizer;
      preferences = restored.preferences;
      clearTimeout(positionTimer);
      for (const [id, position] of positions) {
        const room = archive.conversations.find(item => item.id === id);
        if (position === null || !room) {
          withinSession.delete(id);
          try { localStorage.removeItem('dialogue-position-' + id); } catch { }
        } else remember(id, Math.min(position, Math.max(0,room.records.length - 1)));
      }
      active = null;
      selection = null;
      librarySelection = null;
      selectionAnchor = null;
      storyFolder = organizer.groups.some(group => group.id === wanted[0].folder) ? wanted[0].folder : '';
      closeModal();
      showRail();
      paintTheme();
      renderReader();
      renderRail();
      status('已撤回 ' + wanted.length + ' 次操作');
    }, 'button primary');
    actions.append(button('取消', showUndoHistory, 'button outline'), apply);
  }

  async function saveConversationOperation(result, undoInfo, preferred, positions) {
    if (libraryBusy) return false;
    libraryBusy = true;
    try {
      const before = active;
      const previousPosition = before ? firstVisible() : 0;
      if (!await writeTogether([['archive',result.archive],['organizer',result.organizer],['preferences',result.preferences]],undoInfo)) {
        status('保存失败，请重试。'); return false;
      }
      archive = result.archive; organizer = result.organizer; preferences = result.preferences;
      clearTimeout(positionTimer);
      if (before && !positions.has(before.id) && !result.removed?.has(before.id)) remember(before.id,previousPosition);
      for (const [id,index] of positions) remember(id,index);
      for (const id of result.removed || []) {
        withinSession.delete(id);try { localStorage.removeItem('dialogue-position-' + id); } catch { }
      }
      active = null; selection = null; selectionAnchor = null; librarySelection = null;
      closeModal(); openConversation(preferred);
      return true;
    } finally { libraryBusy = false; }
  }

      try {
        const next = ArchiveOrganization.move(archive,base,keys,parent);
        if (await saveLibraryOrganizer(next,'已移动 ' + items.length + ' 项')) {
          closeModal(); librarySelection = null; browseStory(parent);
        }
      } catch (error) { status(error.message); }
      save.disabled = false;
    },'button primary');
    actions.append(button('取消',closeModal,'button outline'),save);
  }
  function deleteLibraryDialog(keys) {
    const result = ArchiveOrganization.deletion(archive,organizer,keys);
    if (!result.rooms.size && !result.folders.size) return;
    const {body,actions} = dialog('删除所选项目');
    body.append(node('p','help','将删除 ' + result.folders.size + ' 个文件夹和 ' + result.rooms.size +
      ' 个会话，以及对应收藏。文件夹内的子文件夹和会话也包含在内。删除后可在「撤回」中恢复。'));
    const remove = button('确认删除',async () => {
      if (remove.disabled || libraryBusy) return;
      remove.disabled = true;
      libraryBusy = true;
      const nextPreferences = {...preferences,overrides:Object.fromEntries(Object.entries(preferences.overrides)
        .filter(([id]) => !result.rooms.has(id)))};
      try {
        if (!await writeTogether([['archive',result.archive],['organizer',result.organizer],['preferences',nextPreferences]],
          {type:'delete-library',label:'批量删除 ' + result.folders.size + ' 个文件夹、' + result.rooms.size + ' 个会话'})) {
          status('保存失败，请重试。'); remove.disabled = false; return;
        }
        archive = result.archive; organizer = result.organizer; preferences = nextPreferences;
        clearTimeout(positionTimer);
        for (const id of result.rooms) {
          withinSession.delete(id);
          try { localStorage.removeItem('dialogue-position-' + id); } catch { }
        }
        if (result.rooms.has(active?.id)) { active = null; selection = null; selectionAnchor = null; }
        if (result.folders.has(storyFolder)) storyFolder = '';
        librarySelection = null;
        closeModal(); showRail(); renderRail(); renderReader();
        status('已删除，可在「撤回」中恢复');
      } finally { libraryBusy = false; }
    },'button danger');
    actions.append(button('取消',closeModal,'button outline'),remove);
  }

  // Both pointer and touch events are used so a held finger can drag in Android WebView.
  const libraryClickBlocked = () => libraryHeldPointer !== null || Date.now() < librarySuppressUntil;
  function suppressLibraryClick() { librarySuppressUntil = Date.now() + 450; }
  function cancelLibraryPress() {
    const held = libraryPress;
    libraryPress = null;
    if (!held) return;
    clearTimeout(held.timer); clearTimeout(held.selectTimer); clearTimeout(held.hoverTimer);
    if (held.frame != null) cancelAnimationFrame(held.frame);
    held.ghost?.remove(); held.hint?.remove();
    try { document.documentElement.releasePointerCapture?.(held.pointer); } catch { }
    document.body.classList.remove('library-dragging');
    clearLibraryTargets();
  }
  function clearLibraryTargets() {
    for (const element of document.querySelectorAll('.library-item, .story-crumb')) {
      element.classList.remove('drop-before','drop-after','drop-into','drag-source');
    }
  }
  function beginLibraryPress(event) {
    if (event.button !== 0 || event.isPrimary === false || libraryBusy || libraryPress) return;
    if (event.target.closest('.library-more, .library-check')) return;
    const row = event.target.closest('.library-item');
    if (!row || !libraryItem(row.dataset.libraryKey)) return;
    const held = libraryPress = {key:row.dataset.libraryKey,pointer:event.pointerId,
      startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,active:false,moved:false,
      origin:storyFolder,keys:[],target:null};
    held.timer = setTimeout(() => {
      if (libraryPress !== held) return;
      if ($('search').value.trim()) return;
      held.active = true;
      held.keys = librarySelection?.has(held.key) ? chosenLibraryKeys() : [held.key];
      held.folderIds = new Set(ArchiveOrganization.roots(archive,organizer,held.keys).filter(item => item.kind === 'folder').map(item => item.id));
      const item = libraryItem(held.key);
      held.ghost = node('div','library-drag-ghost',held.keys.length > 1 ? held.keys.length + ' 个项目' : item.title);
      held.hint = node('div','library-drag-hint','拖动排序 · 停留文件夹可进入 · 继续按住可多选');
      held.hint.setAttribute('role','status');
      document.body.append(held.ghost,held.hint);
      document.body.classList.add('library-dragging');
      try { document.documentElement.setPointerCapture?.(held.pointer); } catch { }
      positionLibraryGhost(held);
      held.frame = requestAnimationFrame(libraryDragFrame);
    },event.pointerType === 'mouse' ? 220 : 450);
    held.selectTimer = setTimeout(() => {
      if (libraryPress !== held || held.moved) return;
      const keys = librarySelection ? [...librarySelection,held.key] : [held.key];
      libraryHeldPointer = held.pointer;
      suppressLibraryClick();
      document.getSelection?.()?.removeAllRanges();
      selectLibrary(true,keys);
    },1500);
  }
  function positionLibraryGhost(held) {
    held.ghost.style.left = held.x + 'px';
    held.ghost.style.top = held.y + 'px';
  }
  function canMoveLibraryTarget(held, parent) {
    return (!parent || organizer.groups.some(folder => folder.id === parent)) &&
      !ArchiveLibraryModel.folderPath(organizer.groups,parent).some(folder => held.folderIds.has(folder.id));
  }
  function updateLibraryTarget() {
    const held = libraryPress;
    if (!held?.active || !held.moved) return;
    const hit = document.elementFromPoint(held.x,held.y);
    clearLibraryTargets();
    for (const row of $('conversations').querySelectorAll('.library-item')) {
      if (held.keys.includes(row.dataset.libraryKey)) row.classList.add('drag-source');
    }
    let target = null, into = '';
    const crumb = hit?.closest('.story-crumb');
    const row = hit?.closest('.library-item');
    if (crumb && crumb.dataset.folderId !== storyFolder) {
      into = crumb.dataset.folderId;
      if (canMoveLibraryTarget(held,into)) {
        target = {parent:into,anchor:'',after:false}; crumb.classList.add('drop-into');
      }
    } else if (row) {
      const item = libraryItem(row.dataset.libraryKey);
      if (item && !held.keys.includes(item.key)) {
        const bounds = row.getBoundingClientRect(), part = (held.y - bounds.top) / Math.max(1,bounds.height);
        if (item.kind === 'folder' && part > .22 && part < .78) {
          into = item.id;
          if (canMoveLibraryTarget(held,into)) {
            target = {parent:into,anchor:'',after:false}; row.classList.add('drop-into');
          }
        } else if (!!organizer.pins?.[item.key] === !!organizer.pins?.[held.key]) {
          target = {parent:storyFolder,anchor:item.key,after:part > .5};
          row.classList.add(target.after ? 'drop-after' : 'drop-before');
        }
      }
    } else if (hit?.closest('#conversations')) target = {parent:storyFolder,anchor:'',after:false};
    if (target && !canMoveLibraryTarget(held,target.parent)) target = null;
    held.target = target;
    const hover = target && (crumb || (row && into)) ? 'folder:' + target.parent : '';
    if (hover !== held.hover) {
      clearTimeout(held.hoverTimer); held.hover = hover;
      if (hover) held.hoverTimer = setTimeout(() => {
        if (libraryPress !== held || held.hover !== hover) return;
        storyFolder = target.parent;
        renderRail(); $('conversations').scrollTop = 0;
        held.target = {parent:storyFolder,anchor:'',after:false};
        held.hover = '';
        held.hint.textContent = '已进入「' + storyLabel(storyFolder) + '」，松手放入；可继续拖动';
      },750);
    }
    if (target) held.hint.textContent = target.parent !== storyFolder ? '松手移入「' + storyLabel(target.parent) + '」，停留可进入' :
      target.anchor ? '松手保存顺序' : '松手放入「' + storyLabel(storyFolder) + '」';
    else held.hint.textContent = '拖到同一置顶分组调整顺序，或拖到目标文件夹';
  }
  function libraryDragFrame() {
    const held = libraryPress;
    if (!held?.active) return;
    if (held.moved) {
      const list = $('conversations'), bounds = list.getBoundingClientRect(), edge = 55;
      if (held.x >= bounds.left && held.x <= bounds.right) {
        if (held.y < bounds.top + edge) list.scrollTop -= Math.max(0,Math.min(18,(bounds.top + edge - held.y)/4));
        else if (held.y > bounds.bottom - edge) list.scrollTop += Math.max(0,Math.min(18,(held.y - bounds.bottom + edge)/4));
      }
      updateLibraryTarget();
    }
    held.frame = requestAnimationFrame(libraryDragFrame);
  }
  function moveLibraryPointer(event) {
    const held = libraryPress;
    if (!held || event.pointerId !== held.pointer) return;
    held.x = event.clientX; held.y = event.clientY;
    if (Math.hypot(held.x-held.startX,held.y-held.startY) > 9) {
      held.moved = true; clearTimeout(held.selectTimer);
      if (!held.active) { cancelLibraryPress(); return; }
    }
    if (!held.active) return;
    event.preventDefault();
    positionLibraryGhost(held); updateLibraryTarget();
  }
  async function endLibraryPointer(event) {
    if (event.pointerId === libraryHeldPointer) {
      libraryHeldPointer = null; suppressLibraryClick(); event.preventDefault(); return;
    }
    const held = libraryPress;
    if (!held || event.pointerId !== held.pointer) return;
    if (held.active) { event.preventDefault(); suppressLibraryClick(); }
    const {target,keys,origin,active:dragged,moved} = held;
    cancelLibraryPress();
    if (!dragged || !moved || !target) return;
    try {
      const next = ArchiveOrganization.move(archive,organizer,keys,target.parent,target.anchor,target.after);
      await saveLibraryOrganizer(next,target.anchor ? '已调整顺序' : '已移动项目','manage-library',origin);
    } catch (error) { status(error.message); }
  }

  function navigateBack() {
    if (modal.open) closeModal();
    else if (libraryPress) cancelLibraryPress();
    else if (librarySelection) selectLibrary(false);
    else if (dateOpen) showDates(false);
    else if (selection) selectMessages(false);
    else if (compact.matches && app.classList.contains('reading')) showRail();
    else if (storyFolder) browseStory(ArchiveLibraryModel.folderPath(organizer.groups,storyFolder).at(-1)?.parentId || '');
    else return false;
    return true;
  }

  globalThis.ChatArchiveHost = {back:navigateBack,notice:status,updateResult:acceptUpdateResult};
  $('conversations').addEventListener('pointerdown',beginLibraryPress);
  $('conversations').addEventListener('contextmenu',event => { if (event.target.closest('.library-item')) event.preventDefault(); });
  document.addEventListener('pointermove',moveLibraryPointer,{passive:false});
  document.addEventListener('pointerup',endLibraryPointer);
  document.addEventListener('pointercancel',() => { if (libraryPress?.active || libraryHeldPointer !== null) suppressLibraryClick(); libraryHeldPointer = null; cancelLibraryPress(); });
  document.addEventListener('touchmove',event => { if (libraryPress?.active) event.preventDefault(); },{passive:false});
  document.addEventListener('click',event => {
    if (libraryClickBlocked() && event.target.closest('.library-item, .story-crumb')) {
      event.preventDefault(); event.stopImmediatePropagation();
    }
  },true);
  document.addEventListener('keydown',event => {
    if (event.key === 'Escape' && (libraryPress || librarySelection)) {
      event.preventDefault(); if (libraryPress) cancelLibraryPress(); else selectLibrary(false);
    }
  });

  function cancelMessagePress() {
    if (press) clearTimeout(press.timer);
    press = null;
  }
  function enterHeldMessage() {
    const held = press;
    cancelMessagePress();
    if (!held || active?.id !== held.id) return;
    heldClick = true;
    document.getSelection?.()?.removeAllRanges();
    if (selection) messageActions(active, held.index);
    else selectMessages(true, [held.index]);
  }
  scroller.addEventListener('pointerdown', event => {
    cancelMessagePress();
    if (!active || event.button !== 0 || event.isPrimary === false ||
        event.target.closest('button, input, a, summary, select, textarea')) return;
    const row = event.target.closest('.message');
    if (!row || row.classList.contains('system')) return;
    press = {id:active.id, index:Number(row.dataset.index), x:event.clientX, y:event.clientY,
      timer:setTimeout(enterHeldMessage, 650)};
  });
  scroller.addEventListener('pointermove', event => {
    if (press && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 12) cancelMessagePress();
  });
  for (const event of ['pointercancel','pointerleave','pointerup']) scroller.addEventListener(event, () => {
    cancelMessagePress();
    if (heldClick) setTimeout(() => { heldClick = false; }, 450);
  });
  scroller.addEventListener('contextmenu', event => {
    if (press || heldClick) {
      event.preventDefault();
      if (press) enterHeldMessage();
    }
  });
  scroller.addEventListener('selectstart', event => { if (press || heldClick) event.preventDefault(); });
  scroller.addEventListener('click', event => {
    if (heldClick) {
      event.preventDefault();
      event.stopImmediatePropagation();
      heldClick = false;
    }
  }, true);

  for (const id of ['importButton','welcomeImport']) $(id).addEventListener('click', () => chooseImport(''));
  $('files').addEventListener('change', event => {
    const files = Array.from(event.target.files);
    event.target.value = '';
    pickFiles(files);
  });
  $('demoButton').addEventListener('click', showExamples);
  $('directTab').addEventListener('click', () => selectTab('direct'));
  $('groupTab').addEventListener('click', () => selectTab('group'));
  $('search').addEventListener('input', renderRail);
  $('archiveSearch').addEventListener('click', () => showMessageSearch());
  $('chatSearch').addEventListener('click', () => { if (active) showMessageSearch(active); });
  $('rolesButton').addEventListener('click', showRoles);
  $('aboutButton').addEventListener('click',showAbout);
  $('favoritesButton').addEventListener('click', showFavorites);
  $('backupButton').addEventListener('click',showBackup);
  $('undoButton').addEventListener('click',showUndoHistory);
  $('backupFile').addEventListener('change',event => {
    const file = event.target.files?.[0];
    event.target.value = '';
    if (file) previewRestore(file);
  });
  $('globalStyle').addEventListener('click', () => styleEditor());
  $('conversationStyle').addEventListener('click', () => styleEditor(active));
  $('dateToggle').addEventListener('click', () => showDates(!dateOpen));
  $('chatStart').addEventListener('click', () => jumpToChatBoundary(false));
  $('chatEnd').addEventListener('click', () => jumpToChatBoundary(true));
  $('dateClose').addEventListener('click', () => { showDates(false); $('dateToggle').focus(); });
  $('dateShade').addEventListener('click', () => showDates(false));
  $('more').addEventListener('click', conversationMenu);
  $('back').addEventListener('click', showRail);
  $('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('close', () => { messageEditorCleanup?.();messageEditorCleanup=null; $('modalBody').classList.remove('form-stack'); releaseExportPreview(); releaseDownload(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && dateOpen && !modal.open) showDates(false);
  });
  compact.addEventListener('change', () => { showDates(Boolean(active) && !compact.matches); renderRail(); });
  scroller.addEventListener('scroll', () => {
    cancelMessagePress();
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => {
      scrollFrame = null;
      if (!active) return;
      position = firstVisible();
      highlightDate(position);
      clearTimeout(positionTimer);
      const id = active.id;
      const index = position;
      positionTimer = setTimeout(() => remember(id, index), 130);
    });
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { libraryHeldPointer = null; cancelLibraryPress(); }
    if (document.hidden && active) remember(active.id, firstVisible());
  });

  async function boot() {
    try {
      database = await openDatabase();
      const [storedArchive, storedPreferences, storedOrganizer, storedHistory] = await Promise.all([read('archive'), read('preferences'), read('organizer'), read('history')]);
      archive = storedArchive || archive;
      if (storedPreferences) preferences = {...preferences, ...storedPreferences};
      if (storedOrganizer) organizer = {...organizer, ...storedOrganizer};
      if (Array.isArray(storedHistory)) undoHistory = storedHistory;
    } catch {
      warnStorage();
    }
    organizer = ArchiveOrganization.normalize(archive,organizer);
    paintTheme();
    renderRail();
    if (!compact.matches && archive.conversations.length) openConversation(archive.conversations[0]);
    void setupWebUpdates();
    if(globalThis.NativeArchive?.checkUpdates)void checkRelease(false);
  }
  boot();
})();

</script>
</body>
</html>
