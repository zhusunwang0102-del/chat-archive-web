<html lang="zh-CN">

<title>聊天档案</title>
<style>
:root {
  font-family: Inter, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #1a2520;
  background: #f6f6f4;
  --accent: #176749;
  --accent-soft: #e8f3eb;
  --ink: #1a2520;
  --muted: #626b66;
  --line: #dee4df;
  --panel: #fff;
  --brand: #176749;
  font-synthesis: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { opacity: .48; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .messages:focus-visible, summary:focus-visible {
  outline: 2px solid #3d8661;
  outline-offset: 2px;
}
h1, h2, h3, p { margin: 0; }
.app { display: grid; grid-template-columns: 316px minmax(0,1fr); height: 100%; height: 100dvh; }
.rail { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
.rail-head { padding: 27px 20px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.rail-head h1 { font-size: 22px; font-weight: 780; letter-spacing: -.045em; white-space: nowrap; }
.rail-controls { padding: 0 16px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 13px; background: transparent; border: 1px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 640; line-height: 1.4; white-space: nowrap; }
.primary { color: white; background: var(--accent); }
.primary:hover { background: #10543a; }
.outline { border-color: var(--line); background: #fff; }
.outline:hover, .ghost:hover, .icon-button:hover { background: #eef2ee; }
.ghost { color: #415149; }
.search { height: 39px; padding: 0 11px; background: #f3f5f3; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
.search input { background: transparent; border: none; padding: 7px 0; width: 100%; color: var(--ink); font-size: 13px; }
.search input:focus { outline: none; }
.search:focus-within { box-shadow: 0 0 0 2px #77aa8a; }
.search-icon { display: inline-block; flex: 0 0 12px; height: 12px; border: 1.5px solid #717d75; border-radius: 50%; position: relative; }
.search-icon::after { content: ""; position: absolute; right: -4px; bottom: -2px; width: 5px; height: 1.5px; background: #717d75; transform: rotate(45deg); border-radius: 2px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-top: 11px; }
.tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; padding: 11px 5px; margin-bottom: -1px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 640; }
.tabs button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.tabs button:hover { background: #f7f9f7; }
.conversation-list { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px; }
.conversation { display: grid; grid-template-columns: 43px minmax(0,1fr) auto; width: 100%; gap: 10px; align-items: center; border: 0; border-bottom: 1px solid #eff2ef; background: transparent; padding: 12px 9px; text-align: left; }
.conversation:hover { background: #f3f6f3; }
.conversation[aria-current="true"] { border-bottom-color: transparent; border-radius: 8px; background: var(--accent-soft); }
.conversation-name, .conversation-preview { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conversation-name { font-size: 14px; font-weight: 700; }
.conversation-preview { font-size: 12px; color: var(--muted); margin-top: 5px; }
.conversation-date { align-self: start; font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; }
.rail-note { padding: 22px 12px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.rail-foot { display: flex; padding: 9px 10px calc(9px + env(safe-area-inset-bottom)); align-items: center; border-top: 1px solid var(--line); gap: 2px; }
.rail-foot .button { padding-inline: 8px; }
.local-indicator { margin-left: auto; padding-right: 7px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #59645d; white-space: nowrap; }
.local-indicator i { height: 6px; width: 6px; border-radius: 50%; background: #58966f; }
.local-indicator.warning i { background: #bb713a; }
.reader { min-width: 0; min-height: 0; position: relative; }
.welcome { display: grid; place-items: center; min-height: 100%; padding: 28px; background: radial-gradient(ellipse at 50% 40%,#f6faf6,#f1f3ef 72%); }
.welcome-inner { width: min(100%,400px); text-align: center; padding-bottom: 30px; }
.welcome h2 { font-size: clamp(24px,4vw,34px); letter-spacing: -.05em; font-weight: 780; }
.welcome p { margin: 12px auto 22px; font-size: 14px; color: var(--muted); line-height: 1.65; }
.welcome-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.welcome-actions .button { min-height: 42px; padding-inline: 16px; }
.welcome-art { width: 130px; height: 104px; margin: 0 auto 24px; position: relative; }
.welcome-art i, .welcome-art b { position: absolute; display: block; height: 39px; border-radius: 11px; }
.welcome-art i { width: 75px; background: #fff; box-shadow: 0 5px 17px #18362512; border: 1px solid #dbe5db; left: 6px; top: 12px; transform: rotate(-8deg); }
.welcome-art b { width: 74px; background: #a6df9e; right: 4px; top: 49px; transform: rotate(7deg); }
.welcome-art i::before, .welcome-art b::before { content: ""; width: 45px; height: 13px; position: absolute; left: 14px; top: 13px; border-top: 3px solid #77948580; border-bottom: 3px solid #77948555; border-radius: 1px; }
.welcome-art b::before { border-color: #35644b66; width: 40px; }
.welcome-art i::after, .welcome-art b::after { content: ""; width: 11px; height: 11px; transform: rotate(45deg); position: absolute; bottom: 7px; left: -4px; background: inherit; border-radius: 2px; }
.welcome-art b::after { left: auto; right: -4px; }
.chat { height: 100%; display: flex; flex-direction: column; --chat-bg: #ededed; --incoming: #ffffff; --outgoing: #9eea6a; --message-size: 16px; --message-line: 1.58; --bubble-width: 76%; }
.chat-head { min-height: 66px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 8px 20px; gap: 10px; z-index: 2; }
.chat-title { display: flex; gap: 10px; min-width: 0; align-items: center; }
.chat-title-text { overflow: hidden; }
.chat-title h2 { font-size: 17px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-title p { color: var(--muted); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-title .avatar { width: 36px; height: 36px; font-size: 12px; }
.chat-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.chat-actions .button[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.icon-button { display: grid; place-items: center; border: 0; border-radius: 8px; width: 36px; height: 36px; background: transparent; font-size: 22px; line-height: 1; flex: 0 0 auto; }
.back { display: none; font-size: 29px; }
.calendar-icon { width: 13px; height: 12px; position: relative; border: 1.4px solid currentColor; border-radius: 3px; }
.calendar-icon::before { content: ""; position: absolute; height: 1px; background: currentColor; top: 3px; left: 0; right: 0; }
.chat-body { min-height: 0; flex: 1; display: flex; position: relative; }
.messages { min-width: 0; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; background: var(--chat-bg); padding: 14px max(16px,calc((100% - 865px) / 2)) 30px; scrollbar-gutter: stable; overflow-anchor: none; }
.messages::after { content: ""; display: block; height: var(--jump-space, 0px); }
.entry { max-width: 850px; margin-inline: auto; min-width: 0; }
.date-divider { text-align: center; padding: 20px 0 15px; }
.date-divider time { background: #ffffffa8; color: #56645c; padding: 4px 10px; font-size: 12px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.message { display: flex; justify-content: flex-start; gap: 11px; align-items: flex-start; padding: 5px 1px 9px; }
.message.mine { flex-direction: row-reverse; }
.message.system { justify-content: center; }
.avatar { width: 42px; height: 42px; font: 750 15px/1 Inter,"Noto Sans CJK SC",system-ui,sans-serif; flex: 0 0 auto; display: grid; place-items: center; border-radius: 7px; color: var(--avatar-ink,#2d5945); background: var(--avatar-bg,#dceade); overflow: hidden; }
.avatar.group-avatar { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 3px; gap: 2px; background: #e7e9e6; }
.group-avatar span { display: grid; place-items: center; font-size: 9px; border-radius: 2px; height: 100%; width: 100%; }
.message > .avatar { width: 34px; height: 34px; font-size: 12px; }
.message-stack { min-width: 0; max-width: var(--bubble-width); }
.mine .message-stack { display: flex; flex-direction: column; align-items: flex-end; }
.speaker { color: #5e6961; padding: 0 2px 4px; font-size: 11px; overflow-wrap: anywhere; }
.bubble { position: relative; background: var(--incoming); border-radius: 7px; padding: 9px 12px; color: var(--bubble-ink,#152018); min-width: 28px; font-size: var(--message-size); line-height: var(--message-line); overflow-wrap: anywhere; text-align: left; }
.message:not(.system) .bubble::before { content: ""; position: absolute; top: 13px; left: -4px; width: 9px; height: 9px; border-radius: 1px; transform: rotate(45deg); background: inherit; }
.mine .bubble { background: var(--outgoing); color: var(--my-ink,#14210e); }
.mine:not(.system) .bubble::before { right: -4px; left: auto; }
.bubble > .text, .forward-text { white-space: pre-wrap; }
.bubble time { margin-top: 5px; display: block; text-align: right; font-size: 10px; opacity: .72; line-height: 1.35; font-variant-numeric: tabular-nums; }
.system .bubble { background: #ffffff9e; color: #48584e; font-size: 12px; padding: 6px 10px; text-align: center; }
.system .bubble time { text-align: center; }
.wide .message:not(.system) .bubble::before { display: none; }
.wide .message .message-stack { width: var(--bubble-width); }
.wide .message .bubble { width: 100%; padding: 14px 16px; border-radius: 11px; }
.wide .message.system .message-stack { width: auto; }
.chat.no-avatars .message > .avatar, .chat.no-avatars .chat-title > .avatar { display: none; }
.forward { margin: 3px 0; min-width: min(200px,100%); border: 1px solid #82948766; background: #ffffff65; border-radius: 7px; padding: 8px 10px; color: #254638; }
.forward summary { cursor: pointer; font-size: 13px; font-weight: 700; }
.forward-transcript { border-top: 1px solid #82948755; margin-top: 8px; padding-top: 8px; font-size: .93em; line-height: 1.55; }
.page-control { display: block; margin: 8px auto 17px; background: #ffffffe0; color: #3f5848; }
.dates { display: flex; flex-direction: column; flex: 0 0 217px; background: #fcfdfb; min-height: 0; border-left: 1px solid var(--line); }
.date-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 13px 8px 16px; }
.date-head h3 { font-size: 13px; font-weight: 740; }
.date-head .icon-button { width: 30px; height: 30px; font-size: 20px; }
.date-shortcuts, .boundary-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.date-shortcuts { flex: none; padding: 0 9px 10px; }
.date-shortcuts .button { padding: 4px 7px; font-size: 12px; }
.date-list { overflow: auto; padding: 0 8px 14px; }
.date-list button { display: block; width: 100%; border: 0; text-align: left; padding: 10px 9px; min-height: 38px; border-radius: 7px; color: #58655d; background: transparent; font-size: 12px; }
.date-list button:hover { background: #f0f4ef; }
.date-list button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.date-shade { display: none; }
.modal { width: min(590px,calc(100% - 28px)); max-height: min(86dvh,780px); border: 1px solid var(--line); border-radius: 16px; color: var(--ink); padding: 0; overflow: hidden; box-shadow: 0 18px 75px #10281733; }
.modal[open] { display: flex; flex-direction: column; }
.modal::backdrop { background: #16251c69; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 19px; font-weight: 760; }
.modal-body { padding: 16px 18px; overflow: auto; }
.modal-actions { display: flex; justify-content: end; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal-actions:empty { display: none; }
.help { font-size: 13px; color: var(--muted); line-height: 1.65; }
.form-stack { display: grid; gap: 13px; }
.field { display: grid; min-width: 0; gap: 6px; font-size: 12px; font-weight: 650; color: #43534a; }
.field input:not([type="checkbox"]), .field select, .field textarea { width: 100%; min-width: 0; border: 1px solid #d2ddd4; border-radius: 7px; min-height: 35px; background: #fbfdfb; color: var(--ink); padding: 6px 9px; font-size: 14px; }
.field textarea { resize: vertical; }
.field input[type="color"] { padding: 3px; cursor: pointer; }
.field input[type="range"] { padding-inline: 0; accent-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.palette { grid-template-columns: repeat(3,minmax(0,1fr)); }
.check-field { display: flex; align-items: center; gap: 7px; }
.check-field input { accent-color: var(--accent); }
.roles-list, .import-list { display: grid; gap: 9px; margin: 13px 0; }
.role-row { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.role-row strong { display: block; font-size: 14px; }
.role-row .button { margin-left: auto; }
.import-card { border: 1px solid var(--line); padding: 12px; border-radius: 10px; }
.import-card summary { cursor: pointer; font-size: 13px; overflow-wrap: anywhere; }
.import-card summary::marker { color: var(--accent); }
.import-card[open] summary { margin-bottom: 12px; }
.mapping { display: grid; gap: 7px; }
.mapping .field { grid-template-columns: minmax(0,1fr) minmax(0,1.25fr); align-items: center; }
.mapping .field span { overflow-wrap: anywhere; }
.style-preview { display: grid; gap: 8px; padding: 12px; min-height: 85px; border-radius: 8px; border: 1px solid #00000012; }
.style-preview > span { border-radius: 6px; padding: 5px 8px; justify-self: start; max-width: 94%; }
.style-preview > span + span { justify-self: end; }
.toast { position: fixed; z-index: 5; bottom: max(20px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 36px); padding: 10px 14px; color: white; background: #243c30; border-radius: 8px; box-shadow: 0 5px 17px #10281736; font-size: 13px; }
@media (max-width: 900px) {
  .dates { flex-basis: 185px; }
  .app { grid-template-columns: 270px minmax(0,1fr); }
  .rail-head { padding-inline: 14px; }
  .rail-foot .button { padding-inline: 5px; }
}
@media (max-width: 720px) {
  .app { display: block; }
  .rail, .reader { height: 100%; }
  .app:not(.reading) .reader, .app.reading .rail { display: none; }
  .rail-head { padding: max(20px,env(safe-area-inset-top)) 16px 15px; }
  .conversation { padding: 13px 10px; }
  .chat-head { min-height: 57px; padding: 6px 8px; }
  .back { display: grid; width: 30px; }
  .chat-title { gap: 6px; }
  .chat-title h2 { font-size: 15px; }
  .chat-title .avatar { display: none; }
  .chat-actions { gap: 0; }
  .chat-actions .button { padding-inline: 6px; }
  .chat-actions .icon-button { width: 29px; }
  .messages { padding: 7px 10px calc(20px + env(safe-area-inset-bottom)); scrollbar-gutter: auto; }
  .message { gap: 8px; }
  .message > .avatar { width: 32px; height: 32px; }
  .date-shade { position: absolute; z-index: 2; inset: 0; display: block; border: 0; background: #12221b60; }
  .dates { z-index: 3; position: absolute; right: 0; top: 0; bottom: 0; width: min(248px,77%); box-shadow: -8px 0 23px #162b2026; }
}
@media (prefers-reduced-motion: no-preference) {
  .dates:not([hidden]) { animation: datesIn .13s ease-out; }
  @keyframes datesIn { from { opacity: .45; } to { opacity: 1; } }
}

/* Images, replies and bookmarks */
.rail-foot .button { padding-inline: 6px; }
.group-filter { padding: 9px 16px 0; }
.group-filter label { display: flex; align-items: center; gap: 9px; }
.group-filter select { flex: 1; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: #f8faf8; color: var(--ink); font-size: 13px; }
.avatar {
  position: relative;
  overflow: visible;
  isolation: isolate;
  border-radius: 7px;
}
.avatar-base { width: 100%; height: 100%; display: grid; place-items: center; border-radius: inherit; overflow: hidden; }
.avatar-base > img { width: 100%; height: 100%; display: block; object-fit: cover; }
.avatar-frame {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 50%;
  width: var(--frame-scale,132%);
  height: var(--frame-scale,132%);
  transform: translate(-50%,-50%);
  object-fit: contain;
  pointer-events: none;
}
.avatar.group-avatar { overflow: hidden; }
.message > .avatar { width: 48px; height: 48px; }
.message { padding-inline: 7px; gap: 12px; }
.avatar-editor { display: grid; grid-template-columns: 66px minmax(0,1fr); align-items: start; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.avatar-editor-preview { padding: 6px; }
.avatar-editor-preview .avatar { width: 48px; height: 48px; }
.asset-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.asset-row .field { flex: 1 1 160px; }
.asset-row .field input[type="file"] { font-size: 12px; }
.role-row .role-buttons { display: flex; flex-wrap: wrap; justify-content: end; margin-left: auto; }
.role-row .role-buttons .button { margin-left: 0; padding-inline: 7px; }
.reply-card {
  display: grid;
  gap: 4px;
  width: 100%;
  max-width: 100%;
  min-width: min(180px,100%);
  text-align: left;
  background: #14251a10;
  color: inherit;
  padding: 7px 10px;
  margin: 1px 0 10px;
  border: 0;
  border-left: 3px solid #50715f80;
  border-radius: 4px 6px 6px 4px;
  overflow: hidden;
  line-height: 1.45;
  font-size: .82em;
}
.reply-card strong { font-size: .93em; }
.reply-card span {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.reply-card:hover, .reply-card[aria-expanded="true"] { background: #14251a1b; }
.reply-card[aria-expanded="true"] span { display: block; }
.reply-highlight .bubble { outline: 2px solid #3d8661; outline-offset: 3px; }
.message-footer { display: flex; gap: 6px; justify-content: end; align-items: center; margin-top: 2px; min-height: 21px; }
.message-footer time { margin: 0; }
.bookmark-button { color: inherit; border: 0; background: transparent; border-radius: 4px; padding: 0 3px; min-width: 23px; min-height: 23px; font-size: 16px; opacity: .66; line-height: 1; }
.bookmark-button:hover, .bookmark-button:focus-visible { opacity: 1; background: #14251a16; }
.bookmark-button.is-saved { color: #855213; opacity: 1; }
.selection-bar { display: flex; gap: 6px; align-items: center; padding: 6px 12px; background: #f9fbf8; border-bottom: 1px solid var(--line); font-size: 13px; }
.selection-bar > span { flex: 1; }
.select-message { accent-color: var(--accent); width: 17px; height: 17px; margin: 9px 1px 0; flex: 0 0 auto; }
.selecting .message { flex-wrap: nowrap; }
.more-text { margin-top: 7px; padding: 3px 7px; min-height: 28px; color: inherit; background: #1a302014; }
.more-text:hover { background: #1a302024; }
.text-end-control { margin: 0 0 8px; }
.text, .forward-text { white-space: pre-wrap; }
.favorite-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: start; gap: 6px; }
.favorite-open { display: grid; justify-items: start; width: 100%; white-space: normal; text-align: left; align-content: center; gap: 4px; padding: 10px 12px; overflow-wrap: anywhere; }
.favorite-open strong { font-size: 14px; }
.favorite-open .help { font-size: 11px; }
.favorite-preview { padding: 10px 12px; border-radius: 8px; background: #f3f6f3; overflow-wrap: anywhere; }
.favorite-preview .text { margin-top: 4px; font-size: 14px; line-height: 1.65; }
.favorite-preview .help { font-size: 11px; }
@media (max-width: 720px) {
  .message > .avatar { width: 48px; height: 48px; }
  .message { gap: 9px; padding-inline: 6px; }
  .message-stack { max-width: min(var(--bubble-width),calc(100% - 50px)); }
  .chat.no-avatars .message-stack { max-width: var(--bubble-width); }
}
@media (min-width: 721px) and (max-width: 900px), (max-width: 350px) {
  .rail-foot .local-indicator { font-size: 10px; padding-right: 3px; }
  .rail-foot .button { padding-inline: 4px; }
}

.group-avatar span { overflow: hidden; }
.group-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* App chrome */
:root {

.app { grid-template-columns: 330px minmax(0,1fr); }

.identity-icon i::after { content: ""; position: absolute; left: 2px; bottom: -3px; height: 3px; width: 3px; border-left: 1.6px solid #f6efd6; background: #1b4b39; transform: skewY(-38deg); }
.button { min-height: 39px; border-radius: 10px; }
.primary { background: var(--accent); }

.conversation, .story-entry { border-bottom-color: #edede4; padding-block: 12px; }

.blank-card { margin: 21px 8px 0; padding: 22px 17px; border: 1px solid #e7e8dd; border-radius: 17px; background: linear-gradient(155deg,#fffefa 1%,#f3f6ee 100%); color: var(--ink); text-align: center; }

@media (min-width: 721px) and (max-width: 900px) {

.rail-search { display: flex; align-items: center; gap: 6px; }
.rail-search .search { flex: 1; min-width: 0; }
.rail-search > button { flex: none; white-space: nowrap; }
#chatSearch .search-icon { width: 13px; }
.date-section > summary { color: var(--ink); cursor: pointer; padding: 9px 7px; font-size: 13px; font-weight: 650; border-radius: 7px; overflow-wrap: anywhere; }
.date-section > summary:hover, .date-section > summary.current-date-group { background: var(--accent-soft); color: var(--accent); }

.archive-result:hover { background: var(--accent-soft); }

/* Reading backgrounds share the three mask choices and tint strength in 页间. */
.reading-surface {
  --reading-rgb: 230, 236, 223;
  --reader-badge: #ffffffe0;
  --reader-ink: #35493d;
  --reader-secondary: #43544a;
}
:where(:root[data-theme="night"]) .messages, .reading-surface[data-theme="night"] {
  --reading-rgb: 41, 52, 64;
  --reader-badge: #293440f0;
  --reader-ink: #d9e0e5;
  --reader-secondary: #b9c9d6;
}
.reading-surface[data-background-mask="light"] {
  --reading-rgb: 255, 252, 244;
  --reader-badge: #fffdf8f2;
  --reader-ink: #342f2a;
  --reader-secondary: #5c5449;
}
.reading-surface[data-background-mask="dark"] {
  --reading-rgb: 26, 30, 37;
  --reader-badge: #282d36f2;
  --reader-ink: #f2f0eb;
  --reader-secondary: #c7c3bc;
}
.reading-surface[data-background-mask] {
  --reading-mask: rgba(var(--reading-rgb), .86);
  background-image: linear-gradient(var(--reading-mask), var(--reading-mask)), var(--reading-image);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.messages .date-divider time, .messages .system .bubble {
  background: var(--reader-badge);
  color: var(--reader-ink);
}
.messages .speaker { color: var(--reader-secondary); }
.messages .page-control { background: var(--reader-badge); color: var(--reader-ink); }
.messages .page-control:hover { background: var(--reader-badge); opacity: .88; }
.style-preview[data-background-mask] { min-height: 130px; align-content: center; }
.import-progress { overflow-wrap: anywhere; width: max-content; }

/* 深墨蓝 */
:root[data-theme="night"] {
  color-scheme: dark;
  --ink: #d9e0e5;
  --muted: #a6b6c3;
  --line: #3b4855;
  --accent: #a4b9ca;
  --accent-soft: #344858;
  --panel: #293440;
  --brand: #a4b9ca;
  background: #202832;
}
[data-theme="night"] :is(.rail, .chat-head, .dates, .modal, .selection-bar) { background: var(--panel); }
[data-theme="night"] :is(.welcome, .rail-foot, .modal-actions, .search, .tabs) { background: #202832; }
[data-theme="night"] :is(.tabs, .search, .modal-head, .modal-actions, .conversation, .story-entry) { border-color: var(--line); }
[data-theme="night"] :is(button, input, select, textarea, .messages, summary):focus-visible { outline-color: var(--accent); }
[data-theme="night"] :is(.ghost, .tab-icon, .field, .date-list button, .local-indicator, .story-chevron, .conversation-path, .story-entry-label span) { color: var(--muted); }
[data-theme="night"] :is(.story-crumb[aria-current], .role-open, .date-section > summary, .date-list button[aria-current="true"]) { color: var(--accent); }
[data-theme="night"] :is(.search-icon, .search-icon::after) { border-color: var(--muted); }
[data-theme="night"] .search-icon::after { background: var(--muted); }
[data-theme="night"] .primary { color: #18232b; background: var(--accent); }
[data-theme="night"] .primary:hover { background: #c0d0dc; }
[data-theme="night"] :is(.outline, .story-tools .button, .story-tile, .backup-summary, .stats-table th, .favorite-preview, .import-placement) {
  background: #303e4c;
  color: var(--ink);
  border-color: var(--line);
}
[data-theme="night"] :is(.outline:hover, .ghost:hover, .icon-button:hover, .conversation:hover, .story-entry:hover, .tabs button:hover, .date-list button:hover, .archive-result:hover),
[data-theme="night"] :is(.tabs button[aria-pressed="true"], .conversation[aria-current="true"], .date-list button[aria-current="true"]) {
  background: var(--accent-soft);
  color: var(--ink);
}
[data-theme="night"] :is(.blank-card, .avatar-editor-preview, .crop-editor) { color: var(--ink); background: #25313e; border-color: var(--line); }
[data-theme="night"] :is(.field input:not([type="checkbox"]), .field select, .field textarea, .group-filter select) {
  background: #202832;
  color: var(--ink);
  border-color: var(--line);
}
[data-theme="night"] .tab-icon.bookmark::after { background: #202832; }
[data-theme="night"] .identity-icon, [data-theme="night"] .identity-icon i::after { background: #405b70; }
[data-theme="night"] .story-icon, [data-theme="night"] .story-icon::before { background: #59758a; border-color: #8ba7ba; }
[data-theme="night"] .welcome-art i { background: #344858; border-color: #4a5d6d; }
[data-theme="night"] .welcome-art b { background: #a4b9ca; }
[data-theme="night"] .bookmark-button.is-saved { color: #edd29f; }
[data-theme="night"] .reply-highlight .bubble { outline-color: var(--accent); }
[data-theme="night"] .toast { background: #364c5d; }
[data-theme="night"] .modal::backdrop, [data-theme="night"] .date-shade { background: #10161cb3; }
.bubble .forward { color: inherit; background: #8882; border-color: #8886; }
.bubble .more-text { background: #8882; }
.bubble .more-text:hover { background: #8884; }
.export-heading { font-size: 15px; margin-top: 4px; }
.image-export-preview { max-height: min(48dvh,420px); overflow: auto; border-radius: 10px; background: var(--accent-soft); }
.image-export-preview:empty { display: none; }
.image-export-preview img { display: block; width: 100%; height: auto; }
.danger { color: #a1423a; border-color: #d7b6ad; background: #fff9f5; }
.danger:hover { background: #f8eae3; }
[data-theme="night"] .danger { color: #f2b4aa; border-color: #765854; background: #392c31; }
.batch-days { display: grid; gap: 7px; max-height: 260px; overflow: auto; padding: 3px; }
.batch-days .check-field, .role-delete-choice { justify-content: space-between; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; }
.role-delete-choice span { overflow-wrap: anywhere; }
.message-number { font-size: 10px; opacity: .72; white-space: nowrap; }
.undo-icon { display: block; width: 20px; height: 20px; font-size: 25px; line-height: 20px; font-weight: 500; color: var(--accent); }
.undo-row { display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; overflow-wrap: anywhere; }
.undo-row strong { font-size: 14px; }

/* Conversation library management */
.library-item { position: relative; display: flex; align-items: center; border-radius: 11px; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.library-item > .conversation, .library-item > .story-entry { flex: 1; min-width: 0; position: relative; padding-right: 0; }
.library-item .conversation-date { max-width: 60px; overflow: hidden; text-overflow: ellipsis; }
.library-more { flex: 0 0 30px; align-self: stretch; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 21px; padding: 0; }
.library-more:hover { color: var(--accent); background: var(--accent-soft); }
.library-item.pinned { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.library-item.pinned > .conversation, .library-item.pinned > .story-entry { padding-bottom: 22px; }
.library-pin { position: absolute; right: 1px; bottom: 6px; color: var(--accent); font-size: 9px; line-height: 12px; letter-spacing: .1em; }
.library-check { width: 22px; height: 22px; flex: 0 0 22px; margin: 0 3px 0 5px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--line); color: var(--accent); padding: 0; font-weight: 750; }
.library-item.selected { background: var(--accent-soft); }
.library-item.selected .library-check { background: var(--accent); color: white; border-color: var(--accent); }
.library-selection-bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 3px 10px; padding: 7px 15px; background: var(--accent-soft); border-block: 1px solid var(--line); font-size: 12px; }
.library-selection-bar[hidden] { display: none; }
.library-selection-bar .button { min-height: 30px; padding: 4px 9px; font-size: 12px; }
.library-batch-actions { display: flex; width: 100%; gap: 2px; align-items: center; justify-content: space-between; }
.library-item.drop-before::before, .library-item.drop-after::after { content: ''; position: absolute; z-index: 4; left: 5px; right: 5px; height: 3px; background: var(--accent); border-radius: 3px; }
.library-item.drop-before::before { top: -2px; }
.library-item.drop-after::after { bottom: -2px; }
.library-item.drop-into, .story-crumb.drop-into { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
.library-item.drag-source { opacity: .38; }
.library-dragging, .library-dragging * { cursor: grabbing !important; -webkit-user-select: none !important; user-select: none !important; }

.message { padding-top: calc(var(--message-gap,14px) / 2); padding-bottom: calc(var(--message-gap,14px) / 2); }
.modal:is([data-view="roles"],[data-view="role-home"]) { width: min(720px,calc(100% - 24px)); }

.role-directory-heading h2 { font-size: 23px; margin: 7px 0; letter-spacing: -.03em; }
.role-search { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; color: var(--ink); font-size: 14px; }

.role-card-main > .avatar { width: 58px; height: 58px; font-size: 22px; }

.role-card-tools .button:hover { background: var(--accent-soft); }
.role-home-hero { display: flex; align-items: center; gap: 22px; padding: 18px 8px 24px; }
.role-home-hero > .avatar { width: 82px; height: 82px; flex: 0 0 82px; font-size: 32px; }

.role-stats-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border: 1px solid var(--line); background: var(--panel); border-radius: 17px; overflow: hidden; }

.role-stat-tile:nth-child(3n) { border-right: 0; }.role-stat-tile:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
.role-stat-tile strong { font-size: 24px; font-weight: 660; letter-spacing: -.035em; color: var(--accent); }.role-stat-tile span { color: var(--muted); font-size: 11px; }

.message-media-card > img { width: 75px; max-height: 110px; object-fit: contain; border-radius: 7px; }.message-media-card .button { padding: 4px 6px; font-size: 11px; min-height: 29px; }

.image-crop-stage > img { display: block; max-width: 100%; max-height: 440px; width: auto; height: auto; pointer-events: none; }.image-crop-window { position: absolute; border: 2px solid white; box-shadow: 0 0 0 999px #0007; pointer-events: none; }

<body>
<div class="app" id="app">
  <aside class="rail" aria-label="会话列表">
    <header class="rail-head">
      <div class="identity"><span class="identity-icon" aria-hidden="true"><i></i></span><h1>聊天档案</h1></div>
      <button class="button primary" id="importButton">＋ 导入</button>
    </header>
    <div class="update-notice" id="updateNotice" role="status" hidden></div>
    <div class="rail-controls">
      <div class="rail-search">
        <label class="search"><span class="search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="搜索会话或角色" aria-label="搜索会话或角色"></label>
        <button class="button ghost" id="archiveSearch">搜消息</button>
      </div>
      <nav class="tabs" aria-label="会话分类">
        <button id="directTab" aria-pressed="true">个人聊天</button>
        <button id="groupTab" aria-pressed="false">群聊</button>
      </nav>
    </div>
    <div class="group-filter" id="conversationFilter" hidden></div>
    <div class="library-selection-bar" id="librarySelectionBar" hidden></div>
    <div class="conversation-list" id="conversations"></div>
    <footer class="rail-foot">
      <nav class="rail-actions" aria-label="档案工具">
        <button class="button ghost" id="rolesButton"><span class="tab-icon person" aria-hidden="true"></span>角色管理</button>
        <button class="button ghost" id="globalStyle"><span class="tab-icon layout" aria-hidden="true"></span>默认版式</button>
        <button class="button ghost" id="favoritesButton"><span class="tab-icon bookmark" aria-hidden="true"></span>收藏</button>
        <button class="button ghost" id="backupButton"><span class="tab-icon archive" aria-hidden="true"></span>备份</button>
        <button class="button ghost" id="aboutButton"><span class="undo-icon" aria-hidden="true">↻</span>更新</button>
        <button class="button ghost" id="undoButton"><span class="undo-icon" aria-hidden="true">↶</span>撤回</button>
      </nav>
      <span class="local-indicator" id="localIndicator"><i></i> 本机档案</span>
    </footer>
  </aside>
  <main class="reader" aria-label="聊天阅读">
    <section class="welcome" id="welcome">
      <div class="welcome-inner" id="welcomeInner">
        <div class="welcome-art" aria-hidden="true"><i></i><b></b><span></span></div>
        <h2>把旧对话收进档案</h2>
        <p>导入 TXT 或 Word，就能像翻聊天记录一样回看。</p>
        <div class="welcome-actions">
          <button class="button primary" id="welcomeImport">导入聊天记录</button>
          <button class="button outline" id="demoButton">看看示例</button>
        </div>
      </div>
    </section>
    <section class="chat" id="chat" hidden>
      <header class="chat-head">
        <button class="icon-button back" id="back" title="返回会话列表" aria-label="返回会话列表">‹</button>
        <div id="headerTitle" class="chat-title"></div>
        <div class="chat-actions">
          <button class="icon-button" id="chatSearch" title="搜索聊天内容" aria-label="搜索聊天内容"><span class="search-icon" aria-hidden="true"></span></button>
          <button class="button ghost" id="dateToggle" aria-expanded="false" aria-controls="dates"><span class="calendar-icon" aria-hidden="true"></span> 日期</button>
          <button class="button ghost" id="conversationStyle">版式</button>
          <button class="icon-button" id="more" title="会话选项" aria-label="会话选项">⋯</button>
        </div>
      </header>
      <div class="selection-bar" id="selectionBar" hidden></div>
      <div class="chat-body">
        <div class="messages reading-surface" id="messages" role="region" aria-label="消息记录" tabindex="0"></div>
        <button id="dateShade" class="date-shade" aria-label="关闭日期侧栏" hidden></button>
        <aside class="dates" id="dates" aria-label="跳到日期" hidden>
          <div class="date-head"><h3>跳到日期</h3><button class="icon-button" id="dateClose" aria-label="关闭日期侧栏">×</button></div>
          <div class="date-shortcuts" aria-label="在会话内定位">
            <button class="button outline" id="chatStart">到开头</button>
            <button class="button outline" id="chatEnd">到结尾</button>
          </div>
          <div class="date-list" id="dateList"></div>
        </aside>
      </div>
    </section>
  </main>
</div>
<input id="files" type="file" accept=".txt,.doc,.docx,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<dialog id="modal" class="modal" aria-labelledby="modalTitle">
  <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-button" id="modalClose" aria-label="关闭">×</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-status" id="modalStatus" role="status" hidden></div>
  <div class="modal-actions" id="modalActions"></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<div class="toast import-progress" id="importProgress" role="status" hidden></div>
<script>
const ArchiveText = (() => {
  const messageHead = /^\[(?:(\d{4}-\d{2}-\d{2}|\d{1,2}\s*月\s*\d{1,2}\s*日|无日期)(?:[ T](\d{2}:\d{2}(?::\d{2})?))?|无时间)\]\s+(.+?)\s*$/;
  const dayHead = /^【日期】\s*(.*)$/;
  const forwardedHead = /^\s*【转发消息】\s*以下是我和\s*(.+?)\s*的聊天记录\s*[：:]\s*$/;
  const forwardEnd = /^\s*━+\s*(?:🔼\s*)?收起\s*$/u;
  const rule = /^\s*━+\s*$/u;
  const legacyDate = /^(?:(\d{4})年\s*)?(\d{1,2})月\s*(\d{1,2})日(?:\s+(\d{1,2}:\d{2}))?$/;
  const numericDate = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/;
  const nameHead = /^([^\s：:][^：:\n]{0,39})[：:]\s?(.*)$/;
  const clockOnly = /^\d{1,2}:\d{2}$/;
  const systemName = /^(系统(?:消息)?|system)$/i;
  const usualMe = /^(我|自己|me|user|用户)$/i;
  const metadataHead = /^(标题|用户|角色|场景|会话类型|导出时间|消息数量)\s*[：:]\s*(.*?)\s*$/;
  const normalize = value => value.normalize('NFKC').replace(/\s+/g, '').toLowerCase();
  const trimLines = lines => lines.join('\n').replace(/^(?:[ \t]*\n)+|(?:\n[ \t]*)+$/g, '');

  function dateLabel(value) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
      const [year, month, day] = value.split('-');
      return year + ' 年 ' + Number(month) + ' 月 ' + Number(day) + ' 日';
    }
    return value || '日期未记录';
  }

  function validDay(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return false;
    const date = new Date(value + 'T00:00:00Z');
    return Number.isFinite(+date) && date.toISOString().slice(0, 10) === value;
  }

  function recordDays(records) {
    let heading = '';
    return records.map(row => {
      if (row.kind === 'marker') heading = row.day || '';
      else if (row.day && row.day !== heading) heading = '';
      return row.day || (row.dateIndependent ? '' : heading);
    });
  }

  function newMessage(sender, body, day = '', time = '') {
    return {kind: 'message', sender, body, day, time};
  }
  function speakerLike(name) {
    return typeof name === 'string' && name.trim().length > 0 && name.trim().length <= 60 &&
      !/^[（(\[【<*“‘「『]/u.test(name.trim()) && !/[。，！？；：:!?\r\n]/u.test(name);
  }

  function timedHeaders(lines, hints) {
    const complete = new Set();
    for (const line of lines) {
      const match = line.match(messageHead);
      if (match && validDay(match[1])) complete.add(normalize(match[3]));
    }
    const known = complete.size ? complete : new Set(hints.filter(speakerLike).map(normalize));
    return line => {
      const match = line.match(messageHead);
      if (!match) return null;
      const partial = /^\d{1,2}\s*月/.test(match[1] || '');
      if (partial && known.size && !known.has(normalize(match[3]))) return null;
      if (!validDay(match[1]) && !known.has(normalize(match[3])) && !speakerLike(match[3])) return null;
      return match;
    };
  }

  function forwardClose(lines, start) {
    let index = start + 1;
    if (rule.test(lines[index] || '')) index++;
    for (; index < lines.length; index++) {
      if (forwardEnd.test(lines[index]) || rule.test(lines[index])) return index;
      if (forwardedHead.test(lines[index])) break;
    }
    return -1;
  }

  function parseTimed(lines, headingFor) {
    const records = [];
    let current;
    let forwardThrough = -1;
    function flush() {
      if (!current) return;
      const bodyLines = current.lines.slice();
      while (bodyLines.length && !bodyLines.at(-1).trim()) bodyLines.pop();
      if (bodyLines.at(-1)?.trim() === '---') bodyLines.pop();
      const record = newMessage(current.sender, trimLines(bodyLines), current.day, current.time);
      if (current.dateIndependent) record.dateIndependent = true;
      records.push(record);
    }
    for (const [index, line] of lines.entries()) {
      const heading = index > forwardThrough && headingFor(line);
      const marker = index > forwardThrough && line.match(dayHead);
      if (heading || marker) {
        flush();
        current = heading ? {sender: heading[3], day: heading[1] === '无日期' ? '' : heading[1] || '',
          dateIndependent: heading[1] === '无日期', time: heading[2] || '', lines: []} : undefined;
        if (marker) {
          const day = marker[1].startsWith('日期未记录') ? '' : marker[1];
          records.push({kind: 'marker', day, label: dateLabel(marker[1])});
        }
        continue;
      }
      if (current) {
        current.lines.push(line);
        if (index > forwardThrough && forwardedHead.test(line)) forwardThrough = forwardClose(lines, index);
      } else if (line.trim() && !metadataHead.test(line) && line.trim() !== '---') {
        records.push(newMessage('', line));
      }
    }
    flush();
    return records;
  }

  function readNames(lines, hints) {
    const candidates = new Map();
    for (const line of lines) {
      const match = line.match(nameHead);
      if (!match) continue;
      const name = match[1].trim();
      if (!speakerLike(name) || /^(?:回复\s|\d|https?$|标题$|用户$|角色$|场景$|提示$)/i.test(name)) continue;
      candidates.set(name, (candidates.get(name) || 0) + 1);
    }
    const known = new Set(hints.map(normalize));
    const credible = new Set([...candidates].filter(([name, count]) =>
      known.has(normalize(name)) || usualMe.test(name) || systemName.test(name) || count >= 2
    ).map(([name]) => name));
    if (credible.size < 2 && candidates.size <= 4) {
      for (const name of candidates.keys()) if (name.length <= 16) credible.add(name);
    }
    return credible;
  }

  function parseLegacy(lines, hints) {
    const people = readNames(lines, hints);
    const records = [];
    let speaker = '';
    let body = [];
    let block;
    let sectionHasContent = false;
    function flush() {
      const content = trimLines(body);
      if (speaker || content.trim()) {
        records.push(newMessage(speaker, content));
        sectionHasContent = true;
      }
      speaker = '';
      body = [];
    }
    function mark(day, label = dateLabel(day)) {
      flush();
      if (records.at(-1)?.kind === 'marker' && !sectionHasContent) records.pop();
      records.push({kind: 'marker', day, label});
      sectionHasContent = false;
    }
    for (const [index, line] of lines.entries()) {
      const value = line.trim();
      const date = value.match(legacyDate) || value.match(numericDate);
      if (date && !block) {
        const [, year, month, day] = date;
        const fullDate = year ? year + '-' + month.padStart(2, '0') + '-' + day.padStart(2, '0') : '';
        mark(fullDate || month + ' 月 ' + day + ' 日', fullDate ? dateLabel(fullDate) : month + ' 月 ' + day + ' 日');
        continue;
      }
      const heading = value.match(forwardedHead);
      if (heading) {
        flush();
        if (records.at(-1)?.kind !== 'marker') mark('');
        block = {marker: records.at(-1), end: forwardClose(lines, index)};
        continue;
      }
      if (block && index === block.end) {
        flush();
        const clock = lines[index + 1]?.trim();
        if (!block.marker.day && clockOnly.test(clock || '')) block.marker.label += ' · ' + clock;
        block = undefined;
        continue;
      }
      if (block && rule.test(value)) continue;
      if (!speaker && clockOnly.test(value) && (forwardEnd.test(lines[index - 1] || '') || rule.test(lines[index - 1] || ''))) continue;
      const nextLine = lines[index + 1] || '';
      if (!speaker && /^(Me|我)$/i.test(value) &&
        (forwardedHead.test(nextLine) || people.has(nextLine.match(nameHead)?.[1]?.trim()))) continue;
      const candidate = line.match(nameHead);
      if (candidate && people.has(candidate[1].trim())) {
        flush();
        speaker = candidate[1].trim();
        body.push(candidate[2]);
      } else {
        body.push(line);
      }
    }
    flush();
    return records;
  }

  function parse(filename, source, aliases = []) {
    const lines = source.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
    const metadata = {};
    const roles = [];
    let legacyTitle = '';
    let offset = 0;
    while (offset < lines.length) {
      const value = lines[offset].trim();
      const match = value.match(metadataHead);
      if (match) {
        if (match[1] === '角色') roles.push(match[2]);
        else metadata[match[1]] = match[2];
      } else if (offset === 0 && /聊天记录[：:]?$/.test(value) && !forwardedHead.test(value)) {
        legacyTitle = value.replace(/聊天记录[：:]?$/, '').trim();
      } else if (value) {
        break;
      }
      offset++;
    }
    const content = lines.slice(offset);
    const forwardNames = content.flatMap(line => line.match(forwardedHead)?.[1] || []);
    const hints = [...aliases, ...roles, ...forwardNames, metadata['用户'] || ''];
    const headingFor = timedHeaders(content, hints);
    const timed = content.some(line => headingFor(line));
    const records = timed ? parseTimed(content, headingFor) : parseLegacy(content, hints);
    const messages = records.filter(record => record.kind === 'message');
    const people = [...new Set(messages.map(message => message.sender).filter(name => name && !systemName.test(name)))];
    const importedTitle = metadata['标题'] || legacyTitle;
    let user = people.find(name => normalize(name) === normalize(metadata['用户'] || ''));
    if (!user) user = people.find(name => usualMe.test(name));
    if (!user && people.length === 2) {
      const names = new Set([...forwardNames, ...roles, importedTitle].filter(Boolean).map(normalize));
      const possible = people.filter(name => !names.has(normalize(name)));
      if (possible.length === 1) user = possible[0];
    }
    if (!user && timed && people.length > 2) {
      user = messages.find(message => message.sender && forwardedHead.test(message.body.split('\n')[0]))?.sender;
    }
    const dated = messages.some(message => message.day);
    const title = importedTitle || (!timed && forwardNames[0]) || filename.replace(/\.(?:txt|docx?)$/i, '');
    const format = timed ? (metadata['标题'] || metadata['会话类型'] ? '通用 TXT' : '带时间的聊天记录')
      : forwardNames.length ? '转发聊天记录' : people.length ? '发言人标记' : '纯文本';
    const explicitType = metadata['会话类型'];
    return {filename, title, source, records, people, user: user || '', scene: metadata['场景'] || '',
      type: explicitType ? (explicitType === '群聊' ? 'group' : 'direct') :
        people.length > 2 || /[群組组]$/.test(title) ? 'group' : 'direct',
      format, dated, count: messages.length};
  }

  async function decode(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes[0] === 255 && bytes[1] === 254) return new TextDecoder('utf-16le').decode(bytes);

        if (row.kind !== 'message') return [];
        const version = row.original || row;
        const who = actor(version.sender), body = textKey(version.body,version.attachments || row.attachments);
        let mapping = speakers.get(who);
        if (!mapping) speakers.set(who, mapping = new Map());
        if (!mapping.has(body)) mapping.set(body, next++);
        const day = days[index];
        return [{index, id: mapping.get(body), length: body.length, day, stamp: dateTime(row, day)}];
      });
    }
    const old = flatten(existing, oldDays);
    const added = flatten(incoming, addedDays);
    function uniqueWindows(sequence) {
      const map = new Map();
      for (let index = 0; index + 2 < sequence.length; index++) {
        const a = sequence[index], b = sequence[index + 1], c = sequence[index + 2];
        if (a.id === b.id && b.id === c.id || Math.max(a.length, b.length, c.length) < 12) continue;
        const key = a.id + ',' + b.id + ',' + c.id;
        map.set(key, map.has(key) ? -1 : index);
      }
      return map;
    }
    const earlier = uniqueWindows(old);
    for (const [key, index] of uniqueWindows(added)) {
      const candidate = earlier.get(key) ?? -1;
      if (index < 0 || candidate < 0) continue;
      const right = added.slice(index, index + 3);
      const left = old.slice(candidate, candidate + 3);
      if (right.every((item, i) => item.stamp && left[i].stamp)) continue;
      const safe = right.every((item, i) => {
        const prev = left[i];
        if (validDay(item.day) && validDay(prev.day) && item.day !== prev.day) return false;
        if (item.stamp && prev.stamp && item.stamp !== prev.stamp) return false;
        return matched[item.index] >= 0 ? matched[item.index] === prev.index : !used.has(prev.index);
      });
      if (!safe) continue;

        matched[right[i].index] = left[i].index;

      }

  }

  function mergeConversation(existing, incoming, placements = []) {
    const {bindings, userAliases, actor, records: added} = prepareNames(existing, incoming);
    const old = existing.records;
    const oldDays = recordDays(old);
    const addedDays = recordDays(added);
    const matched = added.map(() => -1);
    const used = new Set();
    matchTimed(old, added, oldDays, addedDays, actor, matched, used);
    matchUndated(old, added, oldDays, addedDays, actor, matched, used);
    const dayRanges = new Map();
    const anchors = [];
    const stampFor = (row, day) => validDay(day) ? dateTime(row, day) || day + (row.kind === 'marker' ? ' ' : ' 99') : '';
    const oldStamps = old.map((row, index) => stampFor(row, oldDays[index]));
    const newStamps = added.map((row, index) => stampFor(row, addedDays[index]));
    for (const [index, stamp] of oldStamps.entries()) {
      if (!stamp) continue;

    let last = -1;
    for (const [index, stamp] of newStamps.entries()) {

      }

      if (!batch) slots.set(slot, batch = []);
      batch.push({record: preserveDay(record, addedDays[index]), stamp: newStamps[index], order: -1, incoming:index});
      if (record.kind === 'message') inserted++;

    for (let index = 0; index <= old.length; index++) {
      const batch = slots.get(index);
      if (batch) {
        if (batch.every(row => row.stamp)) batch.sort((a, b) => a.stamp < b.stamp ? -1 : a.stamp > b.stamp ? 1 : 0);

    const records = combined.map(({record, order, incoming}, index) => {
      if (order >= 0) oldToNew[order] = index;
      if (incoming !== undefined) incomingToNew[incoming] = index;
      return record;
    });
    for (const [index, target] of matched.entries()) if (target >= 0) incomingToNew[index] = oldToNew[target];
    const people = [...new Set(records.map(row => row.sender).filter(sender => sender && !ArchiveText.systemName.test(sender)))];
    const moreSources = [...(existing.moreSources || [])];
    const known = sourceFiles(existing);
    for (const file of sourceFiles(incoming)) {
      if (!known.some(item => item.source === file.source && item.templateKey === file.templateKey)) {
        moreSources.push(file);
        known.push(file);
      }

    return {conversation: {...existing, people, userAliases, bindings, moreSources, records,
      count: records.reduce((count, record) => count + (record.kind === 'message'), 0)}, oldToNew, incomingToNew, inserted, duplicates};
  }

  function remapFavorites(favorites, conversationId, oldToNew) {
    return favorites.map(item => item.conversationId === conversationId ?
      {...item, indices: [...new Set(item.indices.map(index => oldToNew[index]).filter(Number.isInteger))].sort((a,b) => a-b),
        excerpt: item.indices.some(index => !Number.isInteger(oldToNew[index])) ? '' : item.excerpt} : item)
      .filter(item => item.indices.length);
  }

  function dialogueText(body) {
    if (!body.includes('【转发消息】')) return body;
    const lines = body.split('\n');
    const kept = [];
    for (let index = 0; index < lines.length; index++) {
      const line = lines[index];
      const until = ArchiveText.forwardedHead.test(line) ? ArchiveText.forwardClose(lines, index) : -1;
      if (until >= 0) index = until;
      else kept.push(line);
    }
    return kept.join('\n');
  }

  function speakerStats(conversations, speakerFor, textFor) {
    const totals = new Map();
    for (const conversation of conversations) {
      for (const [index, record] of conversation.records.entries()) {
        if (record.kind !== 'message' || ArchiveText.systemName.test(record.sender)) continue;
        const plain = dialogueText(textFor(conversation, index)).replace(/\s/gu, '');
        if (!plain) continue;
        const speaker = speakerFor(conversation, record.sender);
        const old = totals.get(speaker.key) || {...speaker, messages: 0, length: 0};
        old.messages++;
        for (const _ of plain) old.length++;
        totals.set(speaker.key, old);
      }
    }
    return [...totals.values()].sort((a,b) => b.length - a.length || b.messages - a.messages || a.name.localeCompare(b.name, 'zh'));
  }

  return {dialogueText, folderPath, sourceFiles, conversationKey, historyMatcher, mergeConversation, remapFavorites, speakerStats,
    dateGroups, placementPlan, searchMessages, roleAppearances};
})();

// Metadata for the conversation library. Message bodies are never copied for a move.
const ArchiveOrganization = (() => {
  const key = (kind, id) => kind + ':' + id;
  function entries(archive, organizer) {
    return [...organizer.groups.map(value => ({key:key('folder',value.id),kind:'folder',id:value.id,
      parent:value.parentId || '',title:value.name,value})),
      ...archive.conversations.map(value => ({key:key('conversation',value.id),kind:'conversation',id:value.id,
        parent:organizer.assignments[value.id] || '',title:value.title,value}))];
  }
  function normalize(archive, organizer) {
    const items = entries(archive,organizer), lookup = new Map(items.map(item => [item.key,item]));
    const groups = new Set(organizer.groups.map(folder => folder.id));
    const pins = Object.fromEntries(Object.entries(organizer.pins || {}).filter(([id,on]) => on === true && lookup.has(id)));
    const order = Object.fromEntries(Object.entries(organizer.order || {}).flatMap(([parent,keys]) => {
      if ((parent && !groups.has(parent)) || !Array.isArray(keys)) return [];
      const valid = [...new Set(keys)].filter(id => lookup.get(id)?.parent === parent);
      return valid.length ? [[parent,valid]] : [];
    }));
    return {...organizer,pins,order};
  }
  function ordered(archive, organizer, parent) {
    const ranks = new Map((organizer.order?.[parent] || []).map((id,index) => [id,index]));
    return entries(archive,organizer).filter(item => item.parent === parent).sort((a,b) =>
      Number(!!organizer.pins?.[b.key]) - Number(!!organizer.pins?.[a.key]) ||
      (ranks.get(a.key) ?? Infinity) - (ranks.get(b.key) ?? Infinity));
  }
  function roots(archive, organizer, keys) {
    const wanted = new Set(keys), items = entries(archive,organizer), lookup = new Map(items.map(item => [item.key,item]));
    return [...wanted].map(id => lookup.get(id)).filter(item => item &&
      !ArchiveLibraryModel.folderPath(organizer.groups,item.parent).some(folder => wanted.has(key('folder',folder.id))));
  }
  function canMove(archive, organizer, keys, parent) {
    if (parent && !organizer.groups.some(folder => folder.id === parent)) return false;
    const ancestors = new Set(ArchiveLibraryModel.folderPath(organizer.groups,parent).map(folder => folder.id));
    return roots(archive,organizer,keys).every(item => item.kind !== 'folder' || !ancestors.has(item.id));
  }
  function move(archive, organizer, keys, parent, anchor = '', after = false) {
    if (!canMove(archive,organizer,keys,parent)) throw new Error('文件夹不能放进自己或自己的子文件夹。');
    const selected = roots(archive,organizer,keys), wanted = new Set(selected.map(item => item.key));

      if (parent) assignments[item.id] = parent;
      else delete assignments[item.id];

      groups:organizer.groups.map(folder => folderIds.has(folder.id) ? {...folder,parentId:parent} : folder)});
  }
  function pin(archive, organizer, keys, on) {
    const pins = {...organizer.pins};
    for (const id of keys) { if (on) pins[id] = true; else delete pins[id]; }
    return normalize(archive,{...organizer,pins});
  }
  function deletion(archive, organizer, keys) {
    const selected = roots(archive,organizer,keys);
    const folderIds = new Set(selected.filter(item => item.kind === 'folder').map(item => item.id));
    const folders = new Set(organizer.groups.filter(folder => ArchiveLibraryModel.folderPath(organizer.groups,folder.id)
      .some(part => folderIds.has(part.id))).map(folder => folder.id));
    const rooms = new Set(selected.filter(item => item.kind === 'conversation').map(item => item.id));
    for (const room of archive.conversations) if (folders.has(organizer.assignments[room.id])) rooms.add(room.id);
    const nextArchive = {...archive,conversations:archive.conversations.filter(room => !rooms.has(room.id))};
    return {archive:nextArchive,rooms,folders,organizer:normalize(nextArchive,{...organizer,
      groups:organizer.groups.filter(folder => !folders.has(folder.id)),
      assignments:Object.fromEntries(Object.entries(organizer.assignments).filter(([id]) => !rooms.has(id))),
      groupPictures:Object.fromEntries(Object.entries(organizer.groupPictures).filter(([id]) => !rooms.has(id))),
      favorites:organizer.favorites.filter(item => !rooms.has(item.conversationId))})};
  }
  return {key,entries,normalize,ordered,roots,canMove,move,pin,deletion};
})();

const ArchiveConversationOps = (() => {
  function merge(archive, organizer, preferences, ids, targetId, placements = {}, title = '') {
    const wanted = new Set(ids), lookup = new Map(archive.conversations.map(room => [room.id,room]));
    const rooms = [...wanted].map(id => lookup.get(id)).filter(Boolean);
    if (rooms.length !== wanted.size) throw new Error('会话已更新，请重新选择。');
    const target = rooms.find(room => room.id === targetId);
    if (rooms.length < 2 || !target) throw new Error('请至少选择两个会话，并选择保留的窗口。');
    if (rooms.some(room => room.type !== target.type)) throw new Error('个人聊天和群聊请分别合并。');
    let conversation = target, duplicates = 0;
    const mappings = new Map([[target.id,target.records.map((_,index) => index)]]);
    for (const room of rooms.filter(room => room.id !== targetId)) {
      const combined = ArchiveLibraryModel.mergeConversation(conversation,room,placements[room.id] || []);
      for (const [id,mapping] of mappings) mappings.set(id,mapping.map(index => combined.oldToNew[index]));
      mappings.set(room.id,combined.incomingToNew);
      duplicates += combined.duplicates;
      conversation = combined.conversation;
    }
    if (title.trim()) conversation = {...conversation,title:title.trim()};
    const nextArchive = {...archive,conversations:archive.conversations.flatMap(room =>
      room.id === targetId ? [conversation] : wanted.has(room.id) ? [] : [room])};
    const removed = new Set(rooms.filter(room => room.id !== targetId).map(room => room.id));
    const favorites = organizer.favorites.flatMap(item => {
      const mapping = mappings.get(item.conversationId);
      if (!mapping) return [item];
      const indices = [...new Set(item.indices.map(index => mapping[index]).filter(index => conversation.records[index]?.kind === 'message'))].sort((a,b) => a-b);
      return indices.length ? [{...item,conversationId:targetId,indices}] : [];
    });
    const pins = {...organizer.pins}, groupPictures = {...organizer.groupPictures};
    if (rooms.some(room => organizer.pins?.['conversation:' + room.id])) pins['conversation:' + targetId] = true;
    if (!groupPictures[targetId]) {
      const picture = rooms.find(room => groupPictures[room.id]);
      if (picture) groupPictures[targetId] = groupPictures[picture.id];
    }
    const nextOrganizer = ArchiveOrganization.normalize(nextArchive,{...organizer,pins,favorites,
      assignments:Object.fromEntries(Object.entries(organizer.assignments).filter(([id]) => !removed.has(id))),
      groupPictures:Object.fromEntries(Object.entries(groupPictures).filter(([id]) => !removed.has(id)))});
    return {archive:nextArchive,organizer:nextOrganizer,preferences:{...preferences,
      overrides:Object.fromEntries(Object.entries(preferences.overrides).filter(([id]) => !removed.has(id)))},
      conversation,mappings,removed,duplicates};
  }

  function selectedGroups(conversation, indices, perDay = false) {
    const wanted = [...new Set(indices)].filter(index => conversation.records[index]?.kind === 'message').sort((a,b) => a-b);
    const days = ArchiveText.recordDays(conversation.records), groups = new Map();
    for (const index of wanted) {
      const day = perDay ? days[index] : '';

    }

  }
  function extract(archive, organizer, preferences, conversationId, indices,
    {mode = 'copy',perDay = false,parent = '',title = '',uid}) {
    const original = archive.conversations.find(room => room.id === conversationId);
    if (!original) throw new Error('会话已更新，请重新选择。');
    const groups = selectedGroups(original,indices,perDay);
    if (!groups.length) throw new Error('请先选择需要拆分或复制的消息。');
    if (!['copy','move'].includes(mode)) throw new Error('请选择拆分或副本。');
    if (parent && !organizer.groups.some(folder => folder.id === parent)) throw new Error('目标文件夹已更新，请重新选择。');
    const days = ArchiveText.recordDays(original.records), mappings = new Map(), created = [];
    for (const group of groups) {
      const id = uid(), mapping = [];
      if (!id || archive.conversations.some(room => room.id === id) || created.some(room => room.id === id)) throw new Error('无法创建新的会话，请重试。');
      const records = group.indices.map((index,at) => {
        mapping[index] = at;
        return {...original.records[index],day:days[index],dateIndependent:!days[index]};
      });
      const name = (title.trim() || original.title + (mode === 'copy' ? ' · 副本' : ' · 拆分')) +
        (perDay ? ' · ' + (group.day || '未标日期') : '');
      const room = {...original,id,title:name,importTitle:name,records,count:records.length,
        people:[...new Set(records.map(row => row.sender).filter(name => name && !ArchiveText.systemName.test(name)))],
        filename:name + '.txt',source:'',sourceKind:'text',templateKey:'',moreSources:[],derivedFrom:original.id};
      const mine = new Set([original.user,...(original.userAliases || [])]);
      room.source = ArchiveText.toText(room,name => name,name => mine.has(name));
      created.push(room); mappings.set(id,mapping);
    }
    const selected = groups.flatMap(group => group.indices);
    let remaining = mode === 'move' ? ArchiveFeatures.deleteRecords(original,selected) :
      {conversation:original,oldToNew:original.records.map((_,index) => index)};
    if (mode === 'move') {
      const records = remaining.conversation.records, keep = new Set();
      let hasMessages = false;
      for (let index = records.length-1; index >= 0; index--) {
        if (records[index].kind === 'message') { keep.add(index); hasMessages = true; }
        else { if (hasMessages) keep.add(index); hasMessages = false; }
      }
      const compact = [], indices = [];
      for (const [index,row] of records.entries()) if (keep.has(index)) { indices[index] = compact.length; compact.push(row); }
      remaining = {conversation:{...remaining.conversation,records:compact},oldToNew:remaining.oldToNew.map(index => indices[index])};

    const favorites = mode === 'copy' ? organizer.favorites : organizer.favorites.flatMap(item => {
      if (item.conversationId !== original.id) return [item];
      const pieces = [];
      for (const [id,mapping] of [[original.id,remaining.oldToNew],...mappings]) {
        const indices = [...new Set(item.indices.map(index => mapping[index]).filter(Number.isInteger))].sort((a,b) => a-b);
        if (indices.length) pieces.push({...item,id:pieces.length ? uid() : item.id,conversationId:id,indices,

    let nextOrganizer = {...organizer,favorites,assignments:{...organizer.assignments},groupPictures:{...organizer.groupPictures}};
    const overrides = {...preferences.overrides};
    for (const room of created) {
      if (parent) nextOrganizer.assignments[room.id] = parent;
      if (organizer.groupPictures[original.id]) nextOrganizer.groupPictures[room.id] = organizer.groupPictures[original.id];
      if (preferences.overrides[original.id]) overrides[room.id] = preferences.overrides[original.id];
    }
    // Insert new windows next to their source; preserve manual order and hidden chat tabs.
    const originalParent = organizer.assignments[original.id] || '';
    const order = ArchiveOrganization.ordered(nextArchive,nextOrganizer,parent).map(item => item.key)
      .filter(key => !created.some(room => key === 'conversation:' + room.id));
    const anchor = parent === originalParent ? order.indexOf('conversation:' + original.id) : -1;
    order.splice(anchor < 0 ? order.length : anchor + 1,0,...created.map(room => 'conversation:' + room.id));
    nextOrganizer = ArchiveOrganization.normalize(nextArchive,{...nextOrganizer,order:{...nextOrganizer.order,[parent]:order}});
    return {archive:nextArchive,organizer:nextOrganizer,preferences:{...preferences,overrides},created,
      remaining:remaining.conversation,oldToNew:remaining.oldToNew,mappings,count:selected.length};
  }
  return {merge,selectedGroups,extract};
})();

<script>
const ArchiveBackup = (() => {

  const string = value => typeof value === 'string';

  const id = value => string(value) && /^[a-zA-Z0-9_-]{1,128}$/.test(value) && !Object.hasOwn(Object.prototype,value);

  function requireState(test) {
    if (!test) throw new Error('备份里有无法读取的档案数据。');
  }

  function parse(text, defaults) {
    let data;
    try { data = JSON.parse(text.replace(/^\uFEFF/, '')); }
    catch { throw new Error('这份文件无法读取为 JSON。'); }
    if (!object(data) || data.format !== format || data.version !== 1) throw new Error('请选择聊天档案导出的完整备份。');
    const {archive,organizer,preferences,positions} = data;
    requireState(object(archive) && Array.isArray(archive.profiles) && Array.isArray(archive.conversations) &&
      object(organizer) && object(preferences));
    const people = new Set();
    for (const profile of archive.profiles) {
      requireState(object(profile) && id(profile.id) && !people.has(profile.id) && string(profile.name) &&
        Array.isArray(profile.aliases) && profile.aliases.every(string));

    }
    const conversations = new Map();
    for (const room of archive.conversations) {

        string(room.source) && string(room.filename) && ['direct','group'].includes(room.type) &&
        Array.isArray(room.people) && room.people.every(string) && Array.isArray(room.records));
      for (const message of room.records) {
        requireState(object(message));
        if (message.kind === 'marker') requireState(string(message.day) && string(message.label));
        else requireState(message.kind === 'message' && string(message.sender) && string(message.body) &&
          string(message.day) && string(message.time));
        if (message.attachments != null) requireState(Array.isArray(message.attachments) && message.attachments.length <= 20 && message.attachments.every(item =>
          object(item) && ArchiveMedia.safeData(item.data) && Number.isInteger(item.at) && item.at >= 0 && item.at <= message.body.length &&
          Number.isFinite(item.width) && item.width > 0 && item.width <= 4096 && Number.isFinite(item.height) && item.height > 0 && item.height <= 4096));
      }

          index:left?.index ?? -1, before:left?.item ?? null, after:right});
      }
    }
    for (const [section, field] of dictionaries) {
      const old = before[section][field] || {}, next = after[section][field] || {};
      if (old === next) continue;
      for (const id of new Set([...Object.keys(old), ...Object.keys(next)])) {
        const left = Object.hasOwn(old, id) ? old[id] : null;
        const right = Object.hasOwn(next, id) ? next[id] : null;
        if (!equal(left, right)) patches.push({section, field, id, before:left, after:right});
      }

    if (!patches.length) return null;
    return {id:globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2),
      type, label, at:Date.now(), patches:JSON.parse(JSON.stringify(patches)), positions:{}};
  }

  function conflicts(state, action) {
    return action.patches.filter(patch => !equal(valueFor(state, patch), patch.after)).length;
  }

  function messageKey(row) {
    return row?.kind === 'message' ? JSON.stringify([row.day, row.time, row.sender, row.body, ...(row.attachments?.length ? [ArchiveMedia.fingerprint(row.attachments)] : [])]) : '';
  }

  function restore(state, action) {
    const next = {archive:{...state.archive}, organizer:{...state.organizer}, preferences:{...state.preferences}};
    for (const [section, field] of arrays) {
      const patches = action.patches.filter(patch => patch.section === section && patch.field === field);

      const items = next[section][field].filter(item => !ids.has(item.id));

    const roles = new Map(next.archive.profiles.map(profile => [profile.id, profile]));
    const previousRoles = new Map(state.archive.profiles.map(profile => [profile.id, profile]));
    for (const room of next.archive.conversations) {
      for (const id of Object.values(room.bindings || {})) if (id && !roles.has(id) && previousRoles.has(id)) roles.set(id, previousRoles.get(id));
    }
    next.archive.profiles = [...roles.values()];
    const rooms = new Map(next.archive.conversations.map(room => [room.id, room]));
    const previousRooms = new Map(state.archive.conversations.map(room => [room.id, room]));
    const changedRecords = new Set(action.patches.filter(patch => patch.section === 'archive' && patch.field === 'conversations' &&
      patch.before && patch.after && !equal(patch.before.records, patch.after.records)).map(patch => patch.id));
    const restoredFavorites = new Set(action.patches.filter(patch => patch.section === 'organizer' && patch.field === 'favorites').map(patch => patch.id));
    const indices = new Map();
    next.organizer.favorites = next.organizer.favorites.flatMap(item => {
      const room = rooms.get(item.conversationId), previous = previousRooms.get(item.conversationId);
      if (!room) return [];
      let wanted = item.indices;
      if (!restoredFavorites.has(item.id) && previous && changedRecords.has(room.id)) {
        if (!indices.has(room.id)) {
          const mapping = new Map();
          for (const [index, row] of room.records.entries()) {
            const key = messageKey(row);
            if (key && !mapping.has(key)) mapping.set(key, index);
          }
          indices.set(room.id, mapping);
        }
        const mapping = indices.get(room.id);
        wanted = item.indices.map(index => {
          const row = previous.records[index];
          return mapping.get(messageKey(row)) ?? (row?.original ?
            mapping.get(messageKey({...row, ...row.original,attachments:row.original.attachments || []})) : undefined);
        }).filter(Number.isInteger);
      }
      wanted = [...new Set(wanted)].filter(index => room.records[index]?.kind === 'message').sort((a,b) => a-b);
      return wanted.length ? [{...item, indices:wanted, excerpt:wanted.length < item.indices.length ? '' : item.excerpt}] : [];
    });
    const roomIds = new Set(rooms.keys()), groups = new Set(next.organizer.groups.map(group => group.id));
    next.organizer.assignments = Object.fromEntries(Object.entries(next.organizer.assignments)
      .filter(([id, group]) => roomIds.has(id) && groups.has(group)));
    next.organizer.groupPictures = Object.fromEntries(Object.entries(next.organizer.groupPictures).filter(([id]) => roomIds.has(id)));
    next.preferences.overrides = Object.fromEntries(Object.entries(next.preferences.overrides).filter(([id]) => roomIds.has(id)));
    if (next.organizer.pins || next.organizer.order) next.organizer = ArchiveOrganization.normalize(next.archive,next.organizer);
    return next;
  }

  return {create, conflicts, restore};
})();

  async function decodePicture(file, maxSize, quality = .93) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = node('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/webp', quality);
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  function avatarEditor(initial, getName, allowFrame) {

    const root = node('div', 'avatar-editor');

    const fields = node('div', 'form-stack');

    root.append(preview, fields);

  async function pickFiles(files) {
    if (!files.length || busy) return;
    busy = true;
    const aliases = archive.profiles.flatMap(profile => [profile.name, ...profile.aliases]);
    const context = importContext || {folder:storyFolder, target:'', presetId:preferences.importPreset};
    const template = preferences.importPresets.find(item => item.id === context.presetId);
    const owlpost = context.presetId === owlpostPresetId;
    const templateKey = template ? JSON.stringify([template.pattern, template.me]) : '';
    const errors = [];
    const imports = [];
    const progress = $('importProgress');
    async function showProgress(label) {
      progress.textContent = label;
      progress.hidden = false;
      await afterPaint();
    }
    try {
      for (const [index, file] of files.entries()) {
        const word = ArchiveWord.isWord(file);
        try {
          if (!word && !/\.txt$/i.test(file.name) && file.type !== 'text/plain') {
            errors.push(file.name + ' · 请选择 TXT、DOC 或 DOCX 文件');
            continue;
          }
          const count = files.length > 1 ? '（' + (index + 1) + '/' + files.length + '）' : '';
          await showProgress('正在读取文件' + count + ' · ' + file.name);
          const raw = await (word ? ArchiveWord.read(file) : ArchiveText.decode(file));
          const source = word ? raw.replace(/\n$/, '') : raw;
          if (archive.conversations.some(conversation => ArchiveLibraryModel.sourceFiles(conversation)
              .some(file => file.source === source && file.templateKey === templateKey)) ||
            imports.some(item => item.source === source)) {
            errors.push(file.name + ' · 已有相同原文');
            continue;
          }
          await showProgress('正在识别聊天记录' + count);
          const data = template ? ArchivePresets.parseText(file.name, source, template) : ArchiveText.parse(file.name, source, aliases);
          if (!data.count) errors.push(file.name + ' · 文件里没有可读内容');
          else imports.push({...data, templateKey, format: owlpost ? 'OP · ' + data.format : data.format,
            ...(word && !/\.(?:doc|docx)$/i.test(file.name) ? {sourceKind: 'word'} : {})});
        } catch (error) {
          errors.push(file.name + ' · ' + (template || word ? error.message : '读取失败'));
        }
      }
      showImport(imports, errors, context);
    } finally {
      progress.hidden = true;
      busy = false;
    }

        if (!manualTarget) {

          const names = base ? scope.filter(room => [room.title,room.importTitle]

      fields.append(mapping);
      if (!data.people.length) fields.append(node('p', 'help', '没有识别到发言人，这份会按原文显示。'));
      const example = data.records.find(record => record.kind === 'message' && record.body.trim());
      if (example) {
        const sample = example.body.trimStart();
        const line = sample.indexOf('\n');

        fields.append(node('p', 'help', '预览 · ' + (example.sender ? example.sender + '：' : '') + excerpt + (excerpt.length < length ? '…' : '')));
